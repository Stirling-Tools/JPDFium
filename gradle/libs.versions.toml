[versions]
junit = "5.14.4"
pdfbox = "3.0.8"
twelvemonkeys = "3.14.0"
graalvm-buildtools = "1.1.9"
reachability-metadata = "1.1.9"
jmh = "1.37"
jmh-plugin = "0.7.3"

[libraries]
vips-ffm       = { module = "app.photofox.vips-ffm:vips-ffm-core",            version = "1.9.8" }
junit-bom      = { module = "org.junit:junit-bom",                              version.ref = "junit" }
junit-jupiter  = { module = "org.junit.jupiter:junit-jupiter",                  version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
pdfbox         = { module = "org.apache.pdfbox:pdfbox",                          version.ref = "pdfbox" }
imageio-webp   = { module = "com.twelvemonkeys.imageio:imageio-webp",            version.ref = "twelvemonkeys" }
imageio-tiff   = { module = "com.twelvemonkeys.imageio:imageio-tiff",            version.ref = "twelvemonkeys" }
jmh-core       = { module = "org.openjdk.jmh:jmh-core",                         version.ref = "jmh" }
jmh-annproc    = { module = "org.openjdk.jmh:jmh-generator-annprocess",         version.ref = "jmh" }

[plugins]
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-buildtools" }
jmh            = { id = "me.champeau.jmh",               version.ref = "jmh-plugin" }
