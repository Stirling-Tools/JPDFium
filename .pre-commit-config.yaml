repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json

  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: bash -c 'files=$(git diff --cached --name-only --diff-filter=ACM | grep -E "\.(cpp|hpp|h)$" || true); if [ -n "$files" ]; then echo "$files" | xargs clang-format --dry-run --Werror; fi'
        language: system
        pass_filenames: false

      - id: spotless
        name: spotless-check
        entry: ./gradlew spotlessCheck
        language: system
        pass_filenames: false
