name: Bug report
description: Report a reproducible defect in JPDFium.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A minimal reproduction gets fixed fastest. For security issues, use the [private advisory form](https://github.com/Stirling-Tools/JPDFium/security/advisories/new) instead.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code, steps, or sample PDF that triggers the problem.
      placeholder: |
        Code or steps:
        JVM flags (for example --enable-native-access):
        -Djpdfium.* properties:
      render: text

  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Stack trace or native error output, if any.
      render: text

  - type: input
    id: version
    attributes:
      label: JPDFium version
      description: From your BOM or build file, if it is not the latest release.
      placeholder: "1.2.0"

  - type: input
    id: environment
    attributes:
      label: Environment
      description: JDK and `jpdfium-natives-*` module on the runtime classpath.
      placeholder: "Temurin 25, jpdfium-natives-linux-x64"
