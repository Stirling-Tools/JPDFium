name: Feature request
description: Propose a new capability or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [Not supported](https://github.com/Stirling-Tools/JPDFium/blob/main/README.md#not-supported) section of the README first.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that JPDFium makes difficult or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or behavior you would like. A short code sketch or workaround helps.
      render: text
