name: Prebuild libvips (Windows)

# Experimental. Builds libvips from source on Windows against vcpkg-provided
# deps and the pinned PDFium static archive, so the Windows vips bundle can
# load PDFs through PDFium and no longer ships GPL poppler/fftw (the upstream
# libvips/build-win64-mxe zip contains both and cannot be relinked).
#
# Publishes vips-windows-<arch>.zip (a bundled bin/ layout) to a prerelease.
# This is REQUIRED for Windows vips: the upstream MXE zip links GPL-3
# libimagequant and ships GPL fftw/poppler, so those legs are disabled until
# a run here is green and native/vips.version pins the asset.

on:
  workflow_dispatch:
    inputs:
      vips_version:
        description: 'libvips tag (vX.Y.Z)'
        type: string
        default: v8.18.6

permissions:
  contents: write

jobs:
  resolve-sha:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      short: ${{ steps.vars.outputs.short }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - id: vars
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "tag=vips-$(date -u +%Y%m%d)-${sha:0:7}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-sha
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, runner: windows-2022, triplet: x64-windows }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install meson + ninja
        run: python -m pip install --quiet meson ninja

      - name: Fetch pinned PDFium (static, for the vips pdfload link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JPDFIUM_BUILD_MODE: static
        run: bash native/fetch-prebuilt-pdfium.sh ${{ matrix.platform }}

      - name: Install libvips deps with vcpkg
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          TRIPLET="${{ matrix.triplet }}"
          # Permissive deps only: no poppler (GPL), no fftw (GPL), no x265.
          bash native/vcpkg-install.sh \
            pkgconf:$TRIPLET glib:$TRIPLET expat:$TRIPLET orc:$TRIPLET \
            libjpeg-turbo:$TRIPLET libpng:$TRIPLET libtiff:$TRIPLET \
            libwebp:$TRIPLET libheif:$TRIPLET libjxl:$TRIPLET \
            openjpeg:$TRIPLET lcms:$TRIPLET libexif:$TRIPLET \
            librsvg:$TRIPLET openexr:$TRIPLET libraw:$TRIPLET \
            libspng:$TRIPLET highway:$TRIPLET
          echo "PKG_CONFIG_PATH=$VCPKG_INSTALLATION_ROOT/installed/$TRIPLET/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$VCPKG_INSTALLATION_ROOT/installed/$TRIPLET/tools/pkgconf" >> "$GITHUB_PATH"

      - name: Build libvips with PDFium (no fftw, no poppler)
        run: |
          set -euo pipefail
          TRIPLET="${{ matrix.triplet }}"
          PREFIX="$(cygpath -m "$PWD/vips-prefix")"
          PDFIUM_DIR="$(cygpath -m "$PWD/native/pdfium")"

          # libvips requires pdfium >= 4200; the placeholder clears the gate.
          # The static archive is linked whole-archive (below) so PDFium's
          # initializers survive, mirroring the core bridge's CMake.
          PC_DIR="$PWD/vips-pc"
          mkdir -p "$PC_DIR"
          cat > "$PC_DIR/pdfium.pc" <<EOF
          prefix=$PDFIUM_DIR
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include

          Name: pdfium
          Description: pdfium
          Version: 9999
          Requires:
          Libs: -L\${libdir} -lpdfium
          Cflags: -I\${includedir}
          EOF
          export PKG_CONFIG_PATH="$PC_DIR:$PKG_CONFIG_PATH"

          VIPS_TAG="${{ inputs.vips_version }}"
          curl -fsSL --retry 3 --retry-delay 3 \
            "https://github.com/libvips/libvips/archive/refs/tags/${VIPS_TAG}.tar.gz" \
            -o vips.tar.gz
          tar xzf vips.tar.gz

          meson setup build "libvips-${VIPS_TAG#v}" \
            --prefix="$PREFIX" --libdir=lib --buildtype=release \
            -Dauto_features=disabled -Ddeprecated=false -Dexamples=false \
            -Dmodules=disabled -Dintrospection=disabled -Dvapi=false \
            -Dcplusplus=false \
            -Dpdfium=enabled -Dmagick=disabled \
            -Drsvg=enabled -Dopenexr=enabled -Draw=enabled \
            -Dspng=enabled -Dhighway=enabled \
            -Dheif=enabled -Djpeg-xl=enabled -Dopenjpeg=enabled \
            -Dwebp=enabled -Dpng=enabled -Djpeg=enabled -Dtiff=enabled \
            -Dexif=enabled -Dlcms=enabled -Dorc=enabled -Dzlib=enabled \
            -Dc_link_args="/WHOLEARCHIVE:$PDFIUM_DIR/lib/pdfium.lib"

          ninja -C build
          ninja -C build install

      - name: Smoke test vips pdfload (PDFium)
        run: |
          set -euo pipefail
          TRIPLET="${{ matrix.triplet }}"
          PREFIX="$(cygpath -m "$PWD/vips-prefix")"
          export PATH="$PREFIX/bin:$VCPKG_INSTALLATION_ROOT/installed/$TRIPLET/bin:$PATH"
          "$PREFIX/bin/vips.exe" pdfload \
            jpdfium/src/main/resources/pdfs/general/basic-text.pdf /tmp/out.png
          "$PREFIX/bin/vipsheader.exe" /tmp/out.png

      - name: Stage + bundle Windows vips
        run: |
          set -euo pipefail
          export VIPS_WIN_DIST="$(cygpath -m "$PWD/vips-prefix")"
          bash native/build-vips.sh vips-${{ matrix.platform }}

      - name: Package bundled dist (bin/ layout)
        run: |
          set -euo pipefail
          mkdir -p pkg/bin
          cp native/dist/vips-${{ matrix.platform }}/*.dll pkg/bin/
          cp vips-prefix/bin/vips.exe pkg/bin/ 2>/dev/null || true
          (cd pkg && 7z a "../vips-${{ matrix.platform }}.zip" . >/dev/null)
          sha256sum "vips-${{ matrix.platform }}.zip" | tee "vips-${{ matrix.platform }}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vips-${{ matrix.platform }}
          path: |
            vips-${{ matrix.platform }}.zip
            vips-${{ matrix.platform }}.zip.sha256

  publish:
    needs: [resolve-sha, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-sha.outputs.tag }}
          SHA: ${{ needs.resolve-sha.outputs.sha }}
        run: |
          set -euo pipefail
          ls -lh dist
          NOTES=$(cat <<EOF
          **Experimental libvips prebuild** - Windows source build with PDFium
          linked in and without GPL poppler/fftw.

          - Repo SHA: \`$SHA\`
          - Assets: vips-windows-*.zip (bundled bin/ layout) + sha256

          To consume it, set the asset URL + sha in release.yml's
          "Fetch prebuilt libvips (Windows)" step and pin \`native/vips.version\`.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber dist/*.zip dist/*.sha256
          else
            gh release create "$TAG" --title "libvips prebuild $TAG" --notes "$NOTES" --prerelease \
              dist/*.zip dist/*.sha256
          fi
