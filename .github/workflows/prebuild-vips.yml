name: Prebuild libvips

# Builds libvips from source on Windows (vcpkg deps + kvazaar-backed libheif),
# uploads the bundled per-arch zips to a prerelease, and opens a PR bumping
# native/vips.version - mirroring the Prebuild PDFium workflow.
#
# Consumers (release.yml, snapshot.yml) read that pin and fetch the assets
# instead of building vips themselves.

on:
  # Manual dispatch for bootstrap and ad-hoc rebuilds.
  workflow_dispatch:
    inputs:
      vips_version:
        description: 'libvips tag (vX.Y.Z)'
        type: string
        default: v8.18.6
  # Weekly cron: Monday 04:00 UTC, after the Prebuild PDFium run.
  schedule:
    - cron: '0 4 * * 1'
  # Bootstrap while this workflow is brought up on a PR: workflow_dispatch
  # only works from the default branch, so a PR push whose head commit message
  # carries the [prebuild-vips] marker runs the build; other synchronize
  # events skip after a cheap marker check. Drop this trigger after merge.
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  marker:
    # Cheap gate for pull_request runs: only build when the PR head commit
    # message carries the [prebuild-vips] marker. No-op for dispatch/cron.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    permissions:
      contents: read
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MSG=$(gh api "repos/$GITHUB_REPOSITORY/commits/${{ github.event.pull_request.head.sha }}" \
                --jq '.commit.message' 2>/dev/null || true)
          if printf '%s' "$MSG" | grep -qF '[prebuild-vips]'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Marker found - running the prebuild."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No [prebuild-vips] marker in the head commit - skipping."
          fi

  resolve-sha:
    needs: [marker]
    if: always() && (github.event_name != 'pull_request' || needs.marker.outputs.run == 'true')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      short: ${{ steps.vars.outputs.short }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: vars
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "tag=vips-$(date -u +%Y%m%d)-${sha:0:7}" >> "$GITHUB_OUTPUT"

  # Cross-build the trimmed ICU data on Linux (used by the macOS wrap step)
  # before the matrix so the macOS jobs can download it. Mirrors the snapshot
  # workflow's prep-windows-icu job; saves ~10 MB per macOS tarball.
  prep-icu:
    needs: [marker, resolve-sha]
    if: always() && (github.event_name != 'pull_request' || needs.marker.outputs.run == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Install ICU tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential icu-devtools libicu-dev \
            mingw-w64 binutils-mingw-w64 curl unzip
      - name: Cross-build trimmed ICU data
        run: bash native/build-minimal-icu-windows.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icu-data-trimmed
          path: native/dist/icu-data/icudt*l.dat
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [resolve-sha, prep-icu]
    if: always() && needs.prep-icu.result == 'success' && (github.event_name != 'pull_request' || needs.marker.outputs.run == 'true')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,     runner: ubuntu-latest,     os: linux }
          - { platform: linux-arm64,   runner: ubuntu-24.04-arm,  os: linux }
          # musl / Alpine variants, built inside a matching-arch Alpine
          # container (eclipse-temurin:25-jdk-alpine) like the core natives.
          - { platform: linux-musl-x64,   runner: ubuntu-latest,    os: linux, libc: musl }
          - { platform: linux-musl-arm64, runner: ubuntu-24.04-arm, os: linux, libc: musl }
          - { platform: darwin-x64,    runner: macos-15-intel,    os: darwin }
          - { platform: darwin-arm64,  runner: macos-14,          os: darwin }
          - { platform: windows-x64,   runner: windows-2022,      os: windows, triplet: x64-windows }
          - { platform: windows-arm64, runner: windows-11-arm,    os: windows, triplet: arm64-windows }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install meson + ninja
        run: python -m pip install --quiet meson ninja

      # No PDFium on Windows: the component asset ships its own
      # msvcp140/vcruntime/icuuc/dbghelp copies which conflict with the vcpkg
      # runtime (vips.exe died with STATUS_ENTRYPOINT_NOT_FOUND), and the Java
      # path renders PDFs through the core bridge, not vips pdfload
      # (VipsSmokeTest guards the pdfload check on Windows).
      - name: Cache vcpkg binary archives (Windows)
        if: matrix.os == 'windows'
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: |
            ~/.cache/vcpkg/archives
            C:/Users/runneradmin/AppData/Local/vcpkg/archives
            C:/vcpkg/installed
          key: vcpkg-archives-${{ matrix.platform }}-${{ hashFiles('native/vcpkg-vips/vcpkg.json') }}
          restore-keys: |
            vcpkg-archives-${{ matrix.platform }}-

      - name: Install libvips deps with vcpkg
        if: matrix.os == 'windows'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
          VCPKG_BINARY_SOURCES: clear;default,readwrite
        run: |
          TRIPLET="${{ matrix.triplet }}"
          VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"
          INSTALL_ROOT="$(cygpath -m "$VCPKG_ROOT/installed")"
          # The manifest pins a builtin-baseline for reproducibility. vcpkg
          # resolves versions from the checkout's working tree, so fetch that
          # commit and check it out: a baseline newer than the runner's vcpkg
          # otherwise references port revisions its version database lacks.
          BASELINE=$(python3 -c "import json;print(json.load(open('native/vcpkg-vips/vcpkg.json')).get('builtin-baseline',''))")
          if [ -n "$BASELINE" ]; then
            echo "Fetching + checking out pinned vcpkg baseline $BASELINE"
            git -C "$VCPKG_ROOT" fetch --depth=1 origin "$BASELINE" \
              || { echo "ERROR: could not fetch vcpkg baseline $BASELINE" >&2; exit 1; }
            git -C "$VCPKG_ROOT" checkout --detach --force "$BASELINE" \
              || { echo "ERROR: could not check out vcpkg baseline $BASELINE" >&2; exit 1; }
            git -C "$VCPKG_ROOT" log -1 --format='vcpkg baseline: %H %s'
          fi
          # Manifest mode: the manifest disables libheif's default `hevc`
          # feature (GPL-2 x265) and selects permissive codecs only.
          bash native/vcpkg-install.sh \
            --x-manifest-root="$(cygpath -m "$PWD/native/vcpkg-vips")" \
            --x-install-root="$INSTALL_ROOT" \
            --triplet="$TRIPLET"
          PKGCONF=$(find "$INSTALL_ROOT/$TRIPLET/tools" -name 'pkgconf.exe' 2>/dev/null | head -1 || true)
          if [ -z "$PKGCONF" ]; then
            echo "ERROR: pkgconf.exe not found under $INSTALL_ROOT/$TRIPLET/tools" >&2
            exit 1
          fi
          echo "PKG_CONFIG_PATH=$INSTALL_ROOT/$TRIPLET/lib/pkgconfig" >> "$GITHUB_ENV"
          # vcpkg ships the tool as pkgconf.exe; meson probes `pkg-config`.
          echo "PKG_CONFIG=$(cygpath -m "$PKGCONF")" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$(dirname "$PKGCONF")")" >> "$GITHUB_PATH"
          # The runner image sets this, but pin it explicitly so later steps do
          # not depend on the machine environment.
          echo "VCPKG_INSTALLATION_ROOT=$(cygpath -m "$VCPKG_ROOT")" >> "$GITHUB_ENV"

      - name: Cache kvazaar + libheif build (Windows)
        if: matrix.os == 'windows'
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: |
            kvazaar-prefix
            heif-prefix
          key: kvazaar-heif-${{ matrix.platform }}-${{ hashFiles('native/vips-build.env') }}

      - name: Build kvazaar + libheif (BSD HEVC encoder for HEIC)
        if: matrix.os == 'windows'
        # vcpkg's libheif offers HEVC encoding only via x265 (GPL-2.0, and not
        # even for MSVC), so HEIC export needs a permissive encoder. Kvazaar is
        # BSD-3-Clause and libheif has first-class support for it, so build
        # both from source: kvazaar first, then libheif with -DWITH_KVAZAAR=ON
        # against the vcpkg deps for the rest of the codecs. vips then links
        # this libheif (its pkg-config dir is prepended below).
        run: |
          set -euo pipefail
          set -a; . native/vips-build.env; set +a
          TRIPLET="${{ matrix.triplet }}"
          case "$TRIPLET" in
            x64-windows)   ARCH=x64 ;;
            arm64-windows) ARCH=arm64 ;;
            *) echo "ERROR: unsupported triplet $TRIPLET" >&2; exit 1 ;;
          esac
          VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"
          KVAZAAR_PREFIX="$(cygpath -m "$PWD/kvazaar-prefix")"
          HEIF_PREFIX="$(cygpath -m "$PWD/heif-prefix")"
          VIPS_PREFIX="$(cygpath -m "$PWD/vips-prefix")"
          if [ -f "$KVAZAAR_PREFIX/bin/kvazaar.dll" ] && [ -f "$HEIF_PREFIX/bin/heif.dll" ]; then
            echo "kvazaar and libheif restored from cache; skipping build."
            mkdir -p "$VIPS_PREFIX/bin"
            cp "$HEIF_PREFIX"/bin/*.dll "$VIPS_PREFIX/bin/" 2>/dev/null || true
            cp "$KVAZAAR_PREFIX"/bin/*.dll "$VIPS_PREFIX/bin/" 2>/dev/null || true
            echo "PKG_CONFIG_PATH=$KVAZAAR_PREFIX/lib/pkgconfig;$HEIF_PREFIX/lib/pkgconfig;$VCPKG_ROOT/installed/$TRIPLET/lib/pkgconfig" >> "$GITHUB_ENV"
            exit 0
          fi

          curl -fsSL --retry 3 --retry-delay 3 \
            "https://github.com/ultravideo/kvazaar/archive/refs/tags/${KVAZAAR_VERSION}.tar.gz" \
            -o kvazaar.tar.gz
          tar xzf kvazaar.tar.gz
          cmake -S "kvazaar-${KVAZAAR_VERSION#v}" -B kvazaar-build -A "$ARCH" \
            -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX="$KVAZAAR_PREFIX"
          cmake --build kvazaar-build --config Release --parallel
          cmake --install kvazaar-build --config Release
          # kvazaar's CMake installs no pkg-config file, but libheif's
          # generated libheif.pc declares `Requires: kvazaar`, so provide one.
          mkdir -p "$KVAZAAR_PREFIX/lib/pkgconfig"
          cat > "$KVAZAAR_PREFIX/lib/pkgconfig/kvazaar.pc" <<EOF
          prefix=$KVAZAAR_PREFIX
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include

          Name: kvazaar
          Description: kvazaar HEVC encoder
          Version: ${KVAZAAR_VERSION#v}
          Libs: -L\${libdir} -lkvazaar
          Cflags: -I\${includedir}
          EOF

          curl -fsSL --retry 3 --retry-delay 3 \
            "https://github.com/strukturag/libheif/archive/refs/tags/${LIBHEIF_VERSION}.tar.gz" \
            -o libheif.tar.gz
          tar xzf libheif.tar.gz
          cmake -S "libheif-${LIBHEIF_VERSION#v}" -B heif-build -A "$ARCH" \
            -DCMAKE_TOOLCHAIN_FILE="$(cygpath -m "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake")" \
            -DVCPKG_TARGET_TRIPLET="$TRIPLET" \
            -DCMAKE_INSTALL_PREFIX="$HEIF_PREFIX" \
            -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF -DWITH_EXAMPLES=OFF \
            -DWITH_X265=OFF -DWITH_KVAZAAR=ON \
            -DWITH_LIBDE265=ON \
            -DWITH_AOM_ENCODER=ON -DWITH_AOM_DECODER=ON \
            -DWITH_JPEG_ENCODER=ON -DWITH_JPEG_DECODER=ON \
            -DWITH_OpenJPEG_ENCODER=ON -DWITH_OpenJPEG_DECODER=ON \
            -DWITH_HEADER_COMPRESSION=ON -DWITH_UNCOMPRESSED_CODEC=OFF \
            -DKVAZAAR_INCLUDE_DIR="$(cygpath -m "$KVAZAAR_PREFIX/include")" \
            -DKVAZAAR_LIBRARY="$(cygpath -m "$KVAZAAR_PREFIX/lib/kvazaar.lib")"
          cmake --build heif-build --config Release --parallel
          cmake --install heif-build --config Release

          # vips.exe must find heif.dll + kvazaar.dll at smoke time and the
          # bundler stages them from the vips prefix, so put them side by side.
          mkdir -p "$VIPS_PREFIX/bin"
          cp "$HEIF_PREFIX"/bin/*.dll "$VIPS_PREFIX/bin/" 2>/dev/null || true
          cp "$KVAZAAR_PREFIX"/bin/*.dll "$VIPS_PREFIX/bin/" 2>/dev/null || true
          # Prepend our libheif (and the kvazaar .pc it requires) so the vips
          # meson build picks them over vcpkg's.
          echo "PKG_CONFIG_PATH=$KVAZAAR_PREFIX/lib/pkgconfig;$HEIF_PREFIX/lib/pkgconfig;$VCPKG_ROOT/installed/$TRIPLET/lib/pkgconfig" >> "$GITHUB_ENV"

      # musl / Alpine: the whole build runs inside a matching-arch Alpine
      # container via native/ci/musl.sh (apk deps + component musl PDFium +
      # libvips + bundle). Smoke runs on the host against the staged dist.
      - name: Build vips in Alpine (musl)
        if: matrix.libc == 'musl'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JPDFIUM_LIBC: musl
        run: bash native/ci/alpine-exec.sh ${{ matrix.platform }} vips

      # Linux + macOS: build the full-codec libvips from source with the
      # system deps (the script installs them), linking the pinned component
      # PDFium for pdfload. darwin-x64 is a native Intel runner.
      - name: Fetch prebuilt PDFium (vips pdfload)
        if: matrix.libc != 'musl' && (matrix.os == 'linux' || matrix.os == 'darwin')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash native/fetch-prebuilt-pdfium.sh ${{ matrix.platform }}

      - name: x86_64 brew bootstrap (darwin-x64)
        if: matrix.platform == 'darwin-x64'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
          if [ ! -x /usr/local/bin/brew ]; then
            sudo mkdir -p /usr/local/Homebrew /usr/local/etc /usr/local/include \
              /usr/local/lib /usr/local/sbin /usr/local/var /usr/local/opt \
              /usr/local/share/zsh/site-functions /usr/local/share/man/man1 \
              /usr/local/var/homebrew/linked \
              /usr/local/Cellar /usr/local/Caskroom /usr/local/Frameworks
            sudo chown -R "$(whoami):admin" /usr/local/Homebrew /usr/local/etc \
              /usr/local/include /usr/local/lib /usr/local/sbin /usr/local/var \
              /usr/local/opt /usr/local/share/zsh/site-functions /usr/local/share/man/man1 \
              /usr/local/var/homebrew/linked \
              /usr/local/Cellar /usr/local/Caskroom /usr/local/Frameworks
            curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 \
              https://github.com/Homebrew/brew/tarball/main -o /tmp/brew.tgz
            tar xz --strip-components=1 -C /usr/local/Homebrew -f /tmp/brew.tgz
            sudo ln -sf /usr/local/Homebrew/bin/brew /usr/local/bin/brew
          fi
          sudo chown -R "$(whoami):admin" /usr/local/share/man 2>/dev/null || true
          arch -x86_64 /usr/local/bin/brew --prefix

      - name: Pre-link python to unblock later brews (darwin-x64)
        if: matrix.platform == 'darwin-x64'
        run: |
          for f in /usr/local/bin/idle3* /usr/local/bin/pip3* /usr/local/bin/pydoc3* /usr/local/bin/python3*; do
            [ -L "$f" ] || continue
            case "$(readlink "$f")" in /Library/Frameworks/*) rm -f "$f";; esac
          done
          arch -x86_64 /usr/local/bin/brew install python@3.14 || true
          arch -x86_64 /usr/local/bin/brew link --overwrite python@3.14 || true

      - name: Build full-codec libvips (Linux + macOS)
        if: matrix.libc != 'musl' && (matrix.os == 'linux' || matrix.os == 'darwin')
        run: |
          set -a; . native/vips-build.env; set +a
          if [ "${{ matrix.platform }}" = "darwin-x64" ]; then
            export PATH="/usr/local/bin:/usr/local/sbin:$PATH"
            arch -x86_64 bash native/build-vips-full-codecs.sh
          else
            bash native/build-vips-full-codecs.sh
          fi

      - name: Trim ICU data for the bundle (Linux)
        # The vips bundle links PDFium, whose full ICU data file (~30 MB) would
        # dominate the tarball. Pre-stage the trimmed carrier so the bundler's
        # swap replaces it (same trick the core natives use).
        if: matrix.os == 'linux' && matrix.libc != 'musl'
        run: JPDFIUM_TARGET_PLATFORM=${{ matrix.platform }} bash native/build-minimal-icu.sh

      - name: Download trimmed ICU data (macOS)
        if: matrix.os == 'darwin'
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          name: icu-data-trimmed
          path: native/dist/icu-data/

      - name: Trim ICU data for the bundle (macOS)
        # Wraps the trimmed .dat into libicudata.<MAJ>.dylib via a clang
        # .incbin stub; the bundler then swaps PDFium's full 33 MB copy.
        if: matrix.os == 'darwin'
        env:
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.platform == 'darwin-x64' && 'x86_64' || 'arm64' }}
        run: bash native/build-minimal-icu-macos.sh

      - name: Stage + bundle vips (Linux + macOS)
        if: matrix.libc != 'musl' && (matrix.os == 'linux' || matrix.os == 'darwin')
        env:
          JPDFIUM_REQUIRE_SOURCE_VIPS: '1'
          MACOS_ALLOW_UNSIGNED: '1'
        run: bash native/build-vips.sh ${{ matrix.platform }}

      - name: Smoke test vips codec chain (Linux + macOS)
        if: matrix.libc != 'musl' && (matrix.os == 'linux' || matrix.os == 'darwin')
        # macOS: the component PDFium references ICU by its unversioned name
        # while the bundled file keeps the version suffix, so the CLI's dyld
        # lookup can miss it; the consumer VipsSmokeTest (Java loader) gates
        # macOS. Linux is strict.
        continue-on-error: ${{ matrix.os == 'darwin' }}
        run: |
          VIPS_BIN="$(command -v vips || echo /usr/local/bin/vips)"
          test -x "$VIPS_BIN" || { echo "ERROR: vips CLI not found" >&2; exit 1; }
          # Smoke the bundled dist: its flat library set is the exact shipped
          # closure, so the CLI resolves everything from one consistent build
          # (no PDFium/brew lib shadowing).
          DIST="$PWD/native/dist/vips-${{ matrix.platform }}"
          if [ "$(uname -s)" = "Darwin" ]; then
            # arm64 macOS refuses unsigned dylibs; the release path signs with
            # the project certificate, so ad-hoc sign here just for the smoke.
            find "$DIST" -name '*.dylib' -exec codesign --force --sign - {} \; 2>/dev/null || true
            export DYLD_LIBRARY_PATH="$DIST"
          else
            export LD_LIBRARY_PATH="$DIST"
          fi
          "$VIPS_BIN" --version
          "$VIPS_BIN" black out.png 64 64
          "$VIPS_BIN" jpegsave out.png out.jpg
          "$VIPS_BIN" webpsave out.png out.webp
          "$VIPS_BIN" heifsave out.png out.heic
          "$VIPS_BIN" heifsave out.png out.avif
          "$VIPS_BIN" jxlsave out.png out.jxl
          "$VIPS_BIN" jp2ksave out.png out.jp2
          "$VIPS_BIN" tiffsave out.png out.tif
          "$(dirname "$VIPS_BIN")/vipsheader" out.png out.jpg out.webp out.heic out.avif out.jxl out.jp2 out.tif

      - name: Build libvips with PDFium (no fftw, no poppler)
        if: matrix.os == 'windows'
        env:
          INPUT_VIPS_VERSION: ${{ inputs.vips_version }}
        run: |
          set -euo pipefail
          set -a; . native/vips-build.env; set +a
          VIPS_TAG="${INPUT_VIPS_VERSION:-$VIPS_VERSION}"
          if ! [[ "$VIPS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: vips_version must look like vX.Y.Z, got '$VIPS_TAG'" >&2
            exit 1
          fi
          TRIPLET="${{ matrix.triplet }}"
          PREFIX="$(cygpath -m "$PWD/vips-prefix")"

          curl -fsSL --retry 3 --retry-delay 3 \
            "https://github.com/libvips/libvips/archive/refs/tags/${VIPS_TAG}.tar.gz" \
            -o vips.tar.gz
          tar xzf vips.tar.gz
          # MSVC cannot compile the GNU-C libFuzzer standalone engine; the fuzz
          # targets are dev-only (upstream regexp-removes this line for
          # oss-fuzz builds).
          sed -i "s/^subdir('fuzz')/# subdir('fuzz')  # MSVC: GNU-C only/" \
            "libvips-${VIPS_TAG#v}/meson.build"

          # --vsenv: GitHub's default shell has no MSVC environment; meson
          # activates the Visual Studio env itself.
          meson setup build "libvips-${VIPS_TAG#v}" \
            --vsenv \
            --prefix="$PREFIX" --libdir=lib --buildtype=release \
            -Dauto_features=disabled -Ddeprecated=false -Dexamples=false \
            -Dmodules=disabled -Dintrospection=disabled -Dvapi=false \
            -Dcplusplus=false \
            -Dpdfium=disabled -Dmagick=disabled \
            -Drsvg=disabled -Dopenexr=disabled -Draw=disabled \
            -Dspng=enabled -Dhighway=enabled \
            -Dheif=enabled -Djpeg-xl=enabled -Dopenjpeg=enabled \
            -Dwebp=enabled -Dpng=enabled -Djpeg=enabled -Dtiff=enabled \
            -Dexif=enabled -Dlcms=enabled -Dorc=enabled -Dzlib=enabled

          # meson compile/install (not bare ninja): the wrapper re-enters the
          # Visual Studio environment that --vsenv activated; bare ninja from
          # Git Bash cannot run cl.exe.
          meson compile -C build
          meson install -C build
          # Provenance marker: build-vips.sh refuses the upstream MXE zip.
          touch "$PREFIX/vips-source-built"


      - name: Smoke test vips codec chain (Windows)
        if: matrix.os == 'windows'
        run: |
          TRIPLET="${{ matrix.triplet }}"
          PREFIX="$(cygpath -m "$PWD/vips-prefix")"
          VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"
          # POSIX-form PATH entries: MSYS converts each entry when spawning a
          # native process, and Windows-form entries added here would be
          # mangled, leaving vips.exe unable to load the vcpkg DLLs (exit 127).
          export PATH="$(cygpath -u "$PREFIX/bin"):$(cygpath -u "$VCPKG_ROOT/installed/$TRIPLET/bin"):$PATH"
          if ! "$PREFIX/bin/vips.exe" --version; then
            echo "--- vips.exe failed to start; raw loader diagnostics via python ---"
            python -c "import subprocess,sys; p=subprocess.run([sys.argv[1],'--version'],capture_output=True,text=True); print('rc=0x%08X'%(p.returncode & 0xFFFFFFFF)); print('stdout:',p.stdout.strip()); print('stderr:',p.stderr.strip())" "$(cygpath -w "$PREFIX/bin/vips.exe")" || true
            echo "PATH=$PATH"
            exit 1
          fi
          # Exercise the codec chain the Java path uses, including HEIC
          # encode through the kvazaar-backed libheif. Relative paths:
          # vips.exe cannot resolve MSYS /tmp.
          "$PREFIX/bin/vips.exe" black out.png 64 64
          "$PREFIX/bin/vips.exe" jpegsave out.png out.jpg
          "$PREFIX/bin/vips.exe" webpsave out.png out.webp
          "$PREFIX/bin/vips.exe" heifsave out.png out.heic
          # AVIF is heifsave with compression=av1 (VipsFormat.AVIF). The .avif
          # suffix makes libvips select the AV1 encoder itself; bracket
          # options would defeat that postfix detection.
          "$PREFIX/bin/vips.exe" heifsave out.png out.avif
          "$PREFIX/bin/vips.exe" jxlsave out.png out.jxl
          "$PREFIX/bin/vips.exe" jp2ksave out.png out.jp2
          "$PREFIX/bin/vips.exe" tiffsave out.png out.tif
          "$PREFIX/bin/vipsheader.exe" out.png out.jpg out.webp out.heic out.avif out.jxl out.jp2 out.tif

      - name: Stage + bundle Windows vips
        if: matrix.os == 'windows'
        run: |
          set -euo pipefail
          export VIPS_WIN_DIST="$(cygpath -m "$PWD/vips-prefix")"
          bash native/build-vips.sh ${{ matrix.platform }}

      - name: Package bundled dist
        # The bundled dist (native/dist/vips-<platform>) is the consumer
        # artifact: release.yml/snapshot.yml extract it straight into
        # native/dist/vips-<platform> and skip the source build.
        run: |
          set -euo pipefail
          DIST="native/dist/vips-${{ matrix.platform }}"
          bash native/check-bundle-lean.sh "$DIST" "vips-${{ matrix.platform }}"
          bash native/check-bundle-size.sh "$DIST" "vips-${{ matrix.platform }}"
          # xz: ~25% smaller than gzip for these libraries; the consumer
          # fetch extracts with tar -xf (auto-detect).
          tar -cJf "vips-${{ matrix.platform }}.tar.gz" -C "$DIST" .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "vips-${{ matrix.platform }}.tar.gz" | tee "vips-${{ matrix.platform }}.tar.gz.sha256"
          else
            shasum -a 256 "vips-${{ matrix.platform }}.tar.gz" | tee "vips-${{ matrix.platform }}.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vips-${{ matrix.platform }}
          path: |
            vips-${{ matrix.platform }}.tar.gz
            vips-${{ matrix.platform }}.tar.gz.sha256

  publish:
    needs: [marker, resolve-sha, build]
    if: always() && needs.resolve-sha.result == 'success' && needs.build.result == 'success' && (github.event_name != 'pull_request' || needs.marker.outputs.run == 'true')
    permissions:
      contents: write
      pull-requests: write    # open the auto pin-bump PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Verify all platform assets are present
        run: |
          set -euo pipefail
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
            test -f "dist/vips-$p.tar.gz" || { echo "MISSING: vips-$p.tar.gz" >&2; exit 1; }
          done
          # musl is experimental: warn, never block.
          for p in linux-musl-x64 linux-musl-arm64; do
            test -f "dist/vips-$p.tar.gz" || echo "WARNING: missing vips-$p.tar.gz (musl build not green yet)"
          done
          ls -lh dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-sha.outputs.tag }}
          SHA: ${{ needs.resolve-sha.outputs.sha }}
        run: |
          set -euo pipefail
          ls -lh dist
          NOTES=$(cat <<EOF
          **libvips prebuild** - build inputs for JPDFium publishing workflows.

          This is an **infrastructure release**, not a user-facing library release.
          See regular \`v*.*.*\` tags for JPDFium library versions on Maven Central.

          - Source SHA: \`$SHA\`
          - Consumers pin this via \`native/vips.version\`.

          ### Assets

          | Platform      | Asset                      |
          |---------------|----------------------------|
          | linux-x64     | vips-linux-x64.tar.gz      |
          | linux-arm64   | vips-linux-arm64.tar.gz    |
          | darwin-x64    | vips-darwin-x64.tar.gz     |
          | darwin-arm64  | vips-darwin-arm64.tar.gz   |
          | windows-x64   | vips-windows-x64.tar.gz    |
          | windows-arm64 | vips-windows-arm64.tar.gz  |
          | linux-musl-x64   | vips-linux-musl-x64.tar.gz   |
          | linux-musl-arm64 | vips-linux-musl-arm64.tar.gz |

          Each tarball holds the bundled dist for that platform, ready to
          extract into \`native/dist/vips-<platform>/\`.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading/updating assets..."
            gh release upload "$TAG" --clobber dist/*.tar.gz dist/*.sha256
          else
            gh release create "$TAG" --title "libvips prebuild $TAG" --notes "$NOTES" --prerelease \
              dist/*.tar.gz dist/*.sha256
          fi

      - name: Update the pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:     ${{ needs.resolve-sha.outputs.tag }}
          SHA:     ${{ needs.resolve-sha.outputs.sha }}
          SRC_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          # If the pin already matches (e.g. manual re-run of the same SHA), nothing to do.
          CURRENT=$(grep -v '^#' native/vips.version | grep -v '^$' | head -n1 || true)
          if [ "$CURRENT" = "$TAG" ]; then
            echo "Pin already at $TAG - nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rewrite the pin file, preserving comments.
          {
            grep '^#' native/vips.version || true
            echo ""
            echo "$TAG"
          } > native/vips.version.new
          mv native/vips.version.new native/vips.version

          if [ "$SRC_REF" = "publishing-setup" ]; then
            git fetch origin "$SRC_REF"
            git checkout "$SRC_REF"
            git add native/vips.version
            git commit -m "Bump libvips pin to $TAG [skip ci]"
            git push origin "$SRC_REF"
            echo "Pushed pin bump directly to $SRC_REF."
          else
            BRANCH="vips-pin-bump/$TAG"
            git checkout -B "$BRANCH"
            git add native/vips.version
            git commit -m "Bump libvips pin to $TAG"
            git push --force -u origin "$BRANCH"
            gh label create pin-bump --color 1d76db \
              --description "Automated prebuild pin bump" >/dev/null 2>&1 || true
            if ! gh pr view "$BRANCH" >/dev/null 2>&1; then
              gh pr create \
                --base "$SRC_REF" \
                --head "$BRANCH" \
                --label pin-bump \
                --title "Bump libvips pin to $TAG" \
                --body "Automated bump from prebuild-vips workflow.

          - New tag: [$TAG](../../releases/tag/$TAG)
          - Source SHA: [\`$SHA\`](https://github.com/${{ github.repository }}/commit/$SHA)

          Merging this PR will make all subsequent JPDFium publishes consume this prebuild.
          Previous pins remain as GitHub Releases - safe to revert if needed." || {
                echo "WARNING: gh pr create failed, continuing..."
              }
            fi
          fi
