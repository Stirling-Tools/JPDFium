name: Vips Drift Check

# Detects when the libvips/codec inputs pinned in this repository are behind
# upstream, and when the prebuilt libvips pin (native/vips.version) is behind
# the latest vips-* prebuilt release published by the `Prebuild libvips`
# workflow (.github/workflows/prebuild-vips.yml).
#
# Two kinds of drift are reported:
#   1. Source pins (native/vips-build.env: libvips, libheif, aom, kvazaar) vs
#      the latest upstream release/tag.
#   2. Prebuilt pin (native/vips.version) vs the latest vips-* release in this
#      repository (the Windows/consumer artifact).
#
# Non-blocking: it never fails the build - it only opens/updates a tracked
# GitHub issue (label: vips-drift) and closes it once everything is current.

on:
  # Monday 06:47 UTC - after the weekly Prebuild libvips run.
  schedule:
    - cron: '47 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: vips-drift
  cancel-in-progress: true

jobs:
  detect:
    name: Compare pinned vs upstream libvips and codecs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Read pinned versions
        id: pin
        run: |
          set -a; . native/vips-build.env; set +a
          PREBUILT=$(grep -v '^#' native/vips.version | grep -v '^$' | head -n1 || true)
          {
            echo "vips=${VIPS_VERSION:-}"
            echo "libheif=${LIBHEIF_VERSION:-}"
            echo "aom=${AOM_VERSION:-}"
            echo "kvazaar=${KVAZAAR_VERSION:-}"
            echo "prebuilt=${PREBUILT}"
          } >> "$GITHUB_OUTPUT"
          echo "Source pins: vips=${VIPS_VERSION:-} libheif=${LIBHEIF_VERSION:-} aom=${AOM_VERSION:-} kvazaar=${KVAZAAR_VERSION:-}"
          echo "Prebuilt pin: ${PREBUILT:-<empty>}"

      - name: Resolve latest upstream versions
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh_latest() {
            gh api "repos/$1/releases/latest" --jq '.tag_name' 2>/dev/null || true
          }
          VIPS=$(gh_latest libvips/libvips)
          LIBHEIF=$(gh_latest strukturag/libheif)
          KVAZAAR=$(gh_latest ultravideo/kvazaar)
          # aom has no GitHub releases; use the googlesource tag list.
          AOM=$(git ls-remote --tags --refs https://aomedia.googlesource.com/aom 'v3*' 2>/dev/null \
                | awk -F/ '{print $NF}' | sort -V | tail -n1 || true)
          PREBUILT=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
                     --json tagName,publishedAt \
                     --jq '[.[] | select(.tagName | startswith("vips-"))] | sort_by(.publishedAt) | reverse | .[0].tagName // empty' || true)
          {
            echo "vips=$VIPS"
            echo "libheif=$LIBHEIF"
            echo "aom=$AOM"
            echo "kvazaar=$KVAZAAR"
            echo "prebuilt=$PREBUILT"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream: vips=$VIPS libheif=$LIBHEIF aom=$AOM kvazaar=$KVAZAAR prebuilt=$PREBUILT"

      - name: Manage drift issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIN_VIPS:    ${{ steps.pin.outputs.vips }}
          PIN_LIBHEIF: ${{ steps.pin.outputs.libheif }}
          PIN_AOM:     ${{ steps.pin.outputs.aom }}
          PIN_KVAZAAR: ${{ steps.pin.outputs.kvazaar }}
          PIN_PRE:     ${{ steps.pin.outputs.prebuilt }}
          LAT_VIPS:    ${{ steps.latest.outputs.vips }}
          LAT_LIBHEIF: ${{ steps.latest.outputs.libheif }}
          LAT_AOM:     ${{ steps.latest.outputs.aom }}
          LAT_KVAZAAR: ${{ steps.latest.outputs.kvazaar }}
          LAT_PRE:     ${{ steps.latest.outputs.prebuilt }}
        run: |
          set -euo pipefail

          gh label create vips-drift \
            --repo "$GITHUB_REPOSITORY" \
            --description "Pinned libvips/codec versions are behind upstream" \
            >/dev/null 2>&1 || true

          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label vips-drift --state open --json number \
            --jq '.[0].number // empty' || true)

          DRIFT=""
          add_drift() { # name pinned latest
            if [ -n "$2" ] && [ -n "$3" ] && [ "$2" != "$3" ]; then
              printf -v _entry -- '- %s: pinned %s, upstream %s\n' "$1" "$2" "$3"
              DRIFT+="$_entry"
            fi
          }
          add_drift "libvips"    "$PIN_VIPS"    "$LAT_VIPS"
          add_drift "libheif"    "$PIN_LIBHEIF" "$LAT_LIBHEIF"
          add_drift "aom"        "$PIN_AOM"     "$LAT_AOM"
          add_drift "kvazaar"    "$PIN_KVAZAAR" "$LAT_KVAZAAR"
          # Prebuilt pin: only drift when a prebuild exists at all.
          if [ -n "$PIN_PRE" ] && [ -n "$LAT_PRE" ] && [ "$PIN_PRE" != "$LAT_PRE" ]; then
            printf -v _entry -- '- prebuilt (native/vips.version): pinned %s, latest %s\n' "$PIN_PRE" "$LAT_PRE"
            DRIFT+="$_entry"
          fi

          if [ -z "$DRIFT" ]; then
            echo "No drift."
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" \
                --comment "All libvips/codec pins are current - closing."
              echo "Closed stale drift issue #$EXISTING."
            fi
            exit 0
          fi

          echo "DRIFT detected:"
          printf '%s' "$DRIFT"
          BODY=$(printf '%s\n' \
            "Pinned libvips/codec versions are behind upstream." \
            "" \
            "$DRIFT" \
            "Source pins live in \`native/vips-build.env\` (used by the Linux/macOS from-source builds and the Windows prebuild); the prebuilt pin lives in \`native/vips.version\`." \
            "" \
            "To fix: bump the pin(s), run the **Prebuild libvips** workflow (workflow_dispatch, or add the \`prebuild-vips\` label to a PR), then set \`native/vips.version\` to the produced release. Re-run this workflow to confirm the issue closes itself.")
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "Updated drift issue #$EXISTING."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "libvips drift: pinned versions are behind upstream" \
              --label vips-drift \
              --body "$BODY"
            echo "Opened drift issue."
          fi
