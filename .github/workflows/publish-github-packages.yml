name: Publish to GitHub Packages

on:
  push:
    tags: ['v*.*.*']
    branches: [main, publishing-setup]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0 or 1.0.0-SNAPSHOT). If omitted on tag push, derived from the tag.'
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ghpkgs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-natives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    runner: ubuntu-latest }
          - { platform: linux-arm64,  runner: ubuntu-24.04-arm }
          # TODO: darwin-x64 (Intel Mac). The macos-13 free runner pool has
          # 24h+ queues; cross-compiling x86_64 from macos-14 requires x64
          # builds of pcre2/freetype/harfbuzz/icu/qpdf/pugixml/libunibreak
          # which Homebrew doesn't ship dual-arch. Defer to a follow-up.
          - { platform: darwin-arm64, runner: macos-14 }
          - { platform: windows-x64,  runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Install build deps (Linux)
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libpcre2-dev libfreetype6-dev libharfbuzz-dev libicu-dev \
            libqpdf-dev libpugixml-dev libunibreak-dev

      - name: Install build deps (macOS)
        if: startsWith(matrix.platform, 'darwin-')
        run: |
          brew install cmake ninja \
            pcre2 freetype harfbuzz icu4c qpdf pugixml libunibreak \
            pkg-config
          # ICU + others aren't auto-linked into PATH/pkg-config on macOS; expose them.
          {
            echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          } >> "$GITHUB_ENV"

      - name: Install build deps (Windows)
        if: matrix.platform == 'windows-x64'
        run: |
          choco install -y cmake ninja pkgconfiglite
          # vcpkg ships preinstalled on windows-latest; pick up the libs we need.
          vcpkg install pcre2:x64-windows freetype:x64-windows harfbuzz:x64-windows \
                        icu:x64-windows qpdf:x64-windows pugixml:x64-windows \
                        libunibreak:x64-windows
          # CMakeLists.txt uses pkg_check_modules for these libs (same code path
          # as Linux/macOS). Point PKG_CONFIG_PATH at vcpkg's generated .pc
          # files so the lookups resolve.
          {
            echo "CMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
            echo "PKG_CONFIG_PATH=$VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib/pkgconfig"
          } >> "$GITHUB_ENV"

      - name: Fetch prebuilt PDFium (pinned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash native/fetch-prebuilt-pdfium.sh ${{ matrix.platform }}

      - run: bash native/build-real.sh

      - name: Stage binaries
        run: |
          mkdir -p native/dist/${{ matrix.platform }}
          find native/build-real -maxdepth 3 -type f \( \
                -name 'libjpdfium.*' -o -name 'jpdfium.dll' \
             \) -exec cp -v {} native/dist/${{ matrix.platform }}/ \;
          find native/pdfium/lib native/pdfium -maxdepth 3 -type f \( \
                -name 'libpdfium.*' -o -name 'pdfium.dll' \
             \) -exec cp -v {} native/dist/${{ matrix.platform }}/ \; 2>/dev/null || true

      - name: Sanity check
        run: |
          test -n "$(ls -A native/dist/${{ matrix.platform }}/)" || {
            echo "ERROR: no native binaries staged for ${{ matrix.platform }}"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.platform }}
          path: native/dist/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build-natives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install jextract
        run: |
          # jpdfium/build.gradle.kts uses jextract to generate JpdfiumH.java
          # (the FFM bindings) from native/bridge/include/jpdfium.h. Without
          # jextract, compileJava fails on `import ...panama.JpdfiumH`.
          # Download the OpenJDK 25 jextract early-access build for linux-x64.
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          ls "$HOME/jextract-install/bin/"
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: .artifacts
          pattern: natives-*

      - name: Flatten into native/dist/<platform>/
        run: |
          mkdir -p native/dist
          for d in .artifacts/natives-*; do
            plat="${d##*natives-}"
            mkdir -p "native/dist/$plat"
            cp -v "$d"/* "native/dist/$plat/"
          done
          echo "--- final layout ---"
          find native/dist -type f | sort

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            REF="${GITHUB_REF_NAME}"
            VERSION="${REF#v}"
          else
            # Branch push -> SNAPSHOT based on gradle.properties.
            # Non-main branches get the branch name injected so concurrent test
            # branches don't clobber each other's published versions.
            BASE=$(grep '^jpdfium.version=' gradle.properties | cut -d= -f2)
            BASE="${BASE%-SNAPSHOT}"
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              VERSION="${BASE}-SNAPSHOT"
            else
              # slugify branch name: replace non-alphanumerics with dashes
              SLUG=$(echo "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9' '-' | sed 's/-*$//')
              VERSION="${BASE}-${SLUG}-SNAPSHOT"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./gradlew \
            :jpdfium:publishAllPublicationsToGithubPackagesRepository \
            :jpdfium-bom:publishAllPublicationsToGithubPackagesRepository \
            :jpdfium-spring:publishAllPublicationsToGithubPackagesRepository \
            :jpdfium-natives:jpdfium-natives-linux-x64:publishAllPublicationsToGithubPackagesRepository \
            :jpdfium-natives:jpdfium-natives-linux-arm64:publishAllPublicationsToGithubPackagesRepository \
            :jpdfium-natives:jpdfium-natives-darwin-arm64:publishAllPublicationsToGithubPackagesRepository \
            :jpdfium-natives:jpdfium-natives-windows-x64:publishAllPublicationsToGithubPackagesRepository \
            -Pjpdfium.version=${{ steps.v.outputs.version }} \
            --no-daemon --stacktrace

      - name: Summary
        run: |
          echo "### Published to GitHub Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: \`${{ steps.v.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Repo: <https://github.com/${{ github.repository }}/packages>" >> $GITHUB_STEP_SUMMARY
