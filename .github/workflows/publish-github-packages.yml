name: Publish to GitHub Packages

on:
  push:
    tags: ['v*.*.*']
    branches: [main, publishing-setup]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0 or 1.0.0-SNAPSHOT). If omitted on tag push, derived from the tag.'
        required: false

permissions:
  contents: read

concurrency:
  group: ghpkgs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-natives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    runner: ubuntu-latest,    target_cpu: x64   }
          - { platform: linux-arm64,  runner: ubuntu-24.04-arm, target_cpu: arm64 }
          # musl / Alpine (linux-musl-*). Built natively inside a matching-arch
          # Alpine container so the system toolchain + libc are musl; the
          # eclipse-temurin:25-jdk-alpine image provides the musl JDK. Consumes
          # the musl PDFium prebuilds from prebuild-pdfium.yml.
          - { platform: linux-musl-x64,   runner: ubuntu-latest,    libc: musl, container: 'eclipse-temurin:25-jdk-alpine' }
          - { platform: linux-musl-arm64, runner: ubuntu-24.04-arm, libc: musl, container: 'eclipse-temurin:25-jdk-alpine' }
          # darwin-x64 cross-compiles from macos-14 (arm64 host) with an
          # x86_64 Homebrew installed at /usr/local under Rosetta. macos-13
          # free runners have unworkable queue times.
          - { platform: darwin-x64,   runner: macos-14,         target_cpu: x64   }
          - { platform: darwin-arm64, runner: macos-14,         target_cpu: arm64 }
          - { platform: windows-x64,  runner: windows-latest,   target_cpu: x64   }
          - { platform: windows-arm64, runner: windows-11-arm,  target_cpu: arm64 }
    runs-on: ${{ matrix.runner }}
    # musl rows set matrix.container to an Alpine image; all others leave it
    # unset (empty -> runs directly on the host runner).
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        # The musl legs run inside eclipse-temurin:25-jdk-alpine which already
        # ships a musl JDK - setup-java would install a glibc one that cannot
        # run there.
        if: matrix.libc != 'musl'
        with:
          # Temurin does not publish JDK 25 for Windows aarch64; Microsoft
          # Build of OpenJDK does, so use it on the windows-arm64 leg.
          distribution: ${{ matrix.platform == 'windows-arm64' && 'microsoft' || 'temurin' }}
          java-version: '25'

      # Alpine images have no bash/coreutils; bootstrap them (with sh) before any
      # bash step runs. gcompat lets Chromium's glibc-built bundled clang run.
      - name: Bootstrap Alpine (musl)
        if: matrix.libc == 'musl'
        shell: sh
        run: |
          apk add --no-cache bash build-base clang lld cmake ninja pkgconf \
            meson python3 git curl tar xz gcompat libstdc++ linux-headers \
            sudo patchelf coreutils file binutils \
            pcre2-dev freetype-dev harfbuzz-dev icu-dev icu icu-data-full \
            qpdf-dev pugixml-dev libunibreak-dev zlib-dev libjpeg-turbo-dev \
            rust cargo github-cli

      - name: Install build deps (Linux)
        if: startsWith(matrix.platform, 'linux-') && matrix.libc != 'musl'
        # Azure apt mirror + 3x retry + mingw-w64 (for Windows ICU cross-build)
        # + meson (for harfbuzz-no-glib rebuild).
        run: |
          sudo sed -i \
            -e 's|http://ports\.ubuntu\.com|http://azure.ports.ubuntu.com|g' \
            -e 's|http://archive\.ubuntu\.com|http://azure.archive.ubuntu.com|g' \
            -e 's|http://security\.ubuntu\.com|http://azure.archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y \
              build-essential cmake ninja-build pkg-config meson \
              libpcre2-dev libfreetype6-dev libharfbuzz-dev libicu-dev icu-devtools \
              libqpdf-dev libpugixml-dev libunibreak-dev \
              mingw-w64 binutils-mingw-w64 \
              lld \
              patchelf && exit 0
            echo "apt install attempt $attempt failed; retrying in 30s..." >&2
            sleep 30
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1

      - name: Install build deps (macOS, native arm64)
        if: matrix.platform == 'darwin-arm64'
        run: |
          brew install cmake ninja \
            pcre2 freetype harfbuzz icu4c qpdf pugixml libunibreak \
            pkg-config
          {
            echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          } >> "$GITHUB_ENV"

      - name: Install build deps (macOS, x86_64 cross-compile)
        if: matrix.platform == 'darwin-x64'
        run: |
          # macos-14 is arm64. To cross-compile darwin-x64 we need x86_64
          # builds of every pkg-config dep the bridge links against. The
          # cleanest path is a second Homebrew install at /usr/local managed
          # by Rosetta - Homebrew refuses dual-arch in a single prefix and
          # arch -x86_64 brew … uses /usr/local by default.
          sudo softwareupdate --install-rosetta --agree-to-license || true
          # The runner has /usr/local pre-populated by some Apple tools; clear
          # any leftover non-brew files that would clash.
          if [ ! -x /usr/local/bin/brew ]; then
            arch -x86_64 /bin/bash -c \
              'NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL --max-time 120 https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
          fi
          arch -x86_64 /usr/local/bin/brew install \
            pcre2 freetype harfbuzz icu4c qpdf pugixml libunibreak pkg-config
          # Use the host (arm64) cmake/ninja - they emit x64 builds when
          # CMAKE_OSX_ARCHITECTURES=x86_64 is set. Pkg-config from x86_64
          # brew points at x86_64 deps.
          which arch >/dev/null
          {
            echo "PKG_CONFIG_PATH=/usr/local/opt/icu4c/lib/pkgconfig:/usr/local/lib/pkgconfig"
            echo "PKG_CONFIG=/usr/local/bin/pkg-config"
            echo "CMAKE_OSX_ARCHITECTURES=x86_64"
          } >> "$GITHUB_ENV"

      - name: Install build deps (Windows)
        if: startsWith(matrix.platform, 'windows-')
        run: |
          choco install -y cmake --version=4.4.2
          choco install -y ninja --version=1.13.2
          choco install -y pkgconfiglite --version=0.28
          # vcpkg ships preinstalled on windows-latest / windows-11-arm; pick up
          # the libs we need. Installed tree is triplet-scoped, so match the
          # target arch (arm64-windows on windows-11-arm runners).
          if [ "${{ matrix.platform }}" = "windows-arm64" ]; then
            TRIPLET="arm64-windows"
          else
            TRIPLET="x64-windows"
          fi
          vcpkg install pcre2:$TRIPLET freetype:$TRIPLET harfbuzz:$TRIPLET \
                        icu:$TRIPLET qpdf:$TRIPLET pugixml:$TRIPLET \
                        libunibreak:$TRIPLET
          # CMakeLists.txt uses pkg_check_modules for these libs (same code path
          # as Linux/macOS). Point PKG_CONFIG_PATH at vcpkg's generated .pc
          # files so the lookups resolve.
          {
            echo "CMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
            echo "PKG_CONFIG_PATH=$VCPKG_INSTALLATION_ROOT/installed/$TRIPLET/lib/pkgconfig"
          } >> "$GITHUB_ENV"

      - name: Fetch prebuilt PDFium (pinned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash native/fetch-prebuilt-pdfium.sh ${{ matrix.platform }}

      - name: Build qpdf with native crypto (Linux + macOS)
        if: startsWith(matrix.platform, 'linux-') || startsWith(matrix.platform, 'darwin-')
        run: bash native/build-qpdf-native-crypto.sh

      - name: Build harfbuzz without GLib (Linux + macOS)
        if: startsWith(matrix.platform, 'linux-') || startsWith(matrix.platform, 'darwin-')
        run: bash native/build-harfbuzz-no-glib.sh

      - run: bash native/build-real.sh

      - name: Build minimal ICU data (Linux)
        if: startsWith(matrix.platform, 'linux-')
        # JPDFIUM_TARGET_PLATFORM makes the trimmed lib land in the right natives
        # dist dir on the musl legs (linux-musl-*) too.
        env:
          JPDFIUM_TARGET_PLATFORM: ${{ matrix.platform }}
        run: bash native/build-minimal-icu.sh

      - name: Import macOS signing certificate
        if: startsWith(matrix.platform, 'darwin-')
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash native/import-macos-cert.sh

      - name: Stage binaries
        run: |
          mkdir -p native/dist/${{ matrix.platform }}
          # Bridge: libjpdfium.* (Linux/macOS) or jpdfium.dll (Windows).
          find native/build-real -maxdepth 3 -type f \( \
                -name 'libjpdfium.*' -o -name 'jpdfium.dll' \
             \) -exec cp -v {} native/dist/${{ matrix.platform }}/ \;
          # PDFium component-build dependencies (libabsl, icuuc, libpng, libc++ ...).
          # System.load on pdfium.dll fails otherwise: "Can't find dependent libraries".
          # Filter out Windows debug helpers that PDFium's gn build picks up
          # from the MSVC install dir (dbghelp.dll, msdia140.dll, symsrv.dll,
          # dbgcore.dll, vccorlib140.dll) - they're not runtime deps, just
          # Chromium-style symbol-collection scaffolding, and add ~5 MB.
          if [ -d native/pdfium/lib ]; then
            find native/pdfium/lib -maxdepth 1 -type f \( \
                  -name '*.dll' -o -name 'lib*.so' -o -name 'lib*.so.*' -o -name 'lib*.dylib' \
               \) \
               ! -name 'dbghelp.dll' ! -name 'dbgcore.dll' \
               ! -name 'msdia*.dll'   ! -name 'symsrv.dll' \
               ! -name 'vccorlib*.dll' \
               -exec cp -v {} native/dist/${{ matrix.platform }}/ \;
          fi
          # Bridge's own dynamic deps - pcre2-8, freetype, harfbuzz, icu, qpdf,
          # pugixml, libunibreak + transitive deps. bundle-runtime-deps.sh
          # walks the bridge's import table per-platform (ldd / otool / dumpbin)
          # and copies only what's actually referenced, skipping system libs.
          # No more blanket vcpkg bin glob → no debug-helper bloat in the jar.
          bash native/bundle-runtime-deps.sh ${{ matrix.platform }}
          ls -la native/dist/${{ matrix.platform }}/

      - name: Sanity check
        run: |
          test -n "$(ls -A native/dist/${{ matrix.platform }}/)" || {
            echo "ERROR: no native binaries staged for ${{ matrix.platform }}"
            exit 1
          }

      # Beyond "a file exists": load the freshly-built native via the production
      # NativeLoader and open a PDF. Skipped for darwin-x64 (cross-compiled on an
      # arm64 host, so the x64 native can't run here); other platforms build on
      # their own arch.
      - name: Install jextract (for smoke build)
        # jextract only ships glibc builds, so the musl smoke uses the committed
        # bindings (generateBindings is skipped when jextract is absent).
        if: matrix.platform != 'darwin-x64' && matrix.libc != 'musl'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   JX=openjdk-25-jextract+2-4_linux-x64_bin.tar.gz ;;
            macOS)   if [ "$(uname -m)" = arm64 ]; then JX=openjdk-25-jextract+2-4_macos-aarch64_bin.tar.gz; else JX=openjdk-25-jextract+2-4_macos-x64_bin.tar.gz; fi ;;
            Windows) JX=openjdk-25-jextract+2-4_windows-x64_bin.tar.gz ;;
          esac
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "https://download.java.net/java/early_access/jextract/25/2/$JX" -o /tmp/jx.tar.gz
          tar -xzf /tmp/jx.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Functional smoke test (load native + open a PDF)
        if: matrix.platform != 'darwin-x64'
        run: ./gradlew :jpdfium:nativeSmokeTest -Pjpdfium.testNatives=${{ matrix.platform }} --no-daemon --stacktrace

      # darwin-x64 is cross-compiled on this arm64 (macos-14) host; run its
      # x86_64 smoke under Rosetta with an x86_64 JDK so it gets the same
      # INIT + open-a-PDF gate as every other platform.
      - name: Functional smoke test - darwin-x64 (Rosetta)
        if: matrix.platform == 'darwin-x64'
        shell: bash
        run: |
          curl -fL --max-time 300 --retry 5 --retry-all-errors --retry-delay 3 \
            "https://api.adoptium.net/v3/binary/latest/25/ga/mac/x64/jdk/hotspot/normal/eclipse?project=jdk" \
            -o /tmp/x64-jdk.tar.gz
          mkdir -p "$HOME/x64-jdk"
          tar -xzf /tmp/x64-jdk.tar.gz -C "$HOME/x64-jdk" --strip-components=1
          arch -x86_64 "$HOME/x64-jdk/Contents/Home/bin/java" -version
          export JAVA_HOME="$HOME/x64-jdk/Contents/Home"
          arch -x86_64 ./gradlew :jpdfium:nativeSmokeTest -Pjpdfium.testNatives=darwin-x64 --no-daemon --stacktrace

      - name: Upload hs_err logs (smoke crash diagnostics)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hs_err-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            jpdfium/hs_err_pid*.log
            jpdfium-natives/**/hs_err_pid*.log
            **/hs_err_pid*.log
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: natives-${{ matrix.platform }}
          path: native/dist/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build-natives
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Publish jars to GitHub Packages
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0

      - name: Install jextract
        run: |
          # jpdfium/build.gradle.kts uses jextract to generate JpdfiumH.java
          # (the FFM bindings) from native/bridge/include/jpdfium.h. Without
          # jextract, compileJava fails on `import ...panama.JpdfiumH`.
          # Download the OpenJDK 25 jextract early-access build for linux-x64.
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          ls "$HOME/jextract-install/bin/"
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          path: .artifacts
          pattern: natives-*

      - name: Flatten into native/dist/<platform>/
        run: |
          mkdir -p native/dist
          for d in .artifacts/natives-*; do
            plat="${d##*natives-}"
            mkdir -p "native/dist/$plat"
            cp -v "$d"/* "native/dist/$plat/"
          done
          echo "--- final layout ---"
          find native/dist -type f | sort

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            REF="${GITHUB_REF_NAME}"
            VERSION="${REF#v}"
          else
            # Branch push -> SNAPSHOT based on gradle.properties.
            # Non-main branches get the branch name injected so concurrent test
            # branches don't clobber each other's published versions.
            BASE=$(grep '^jpdfium.version=' gradle.properties | cut -d= -f2)
            BASE="${BASE%-SNAPSHOT}"
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              VERSION="${BASE}-SNAPSHOT"
            else
              # slugify branch name: replace non-alphanumerics with dashes
              SLUG=$(echo "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9' '-' | sed 's/-*$//')
              VERSION="${BASE}-${SLUG}-SNAPSHOT"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./gradlew \
            :jpdfium:publishAllPublicationsToGithubPackagesRepository \
            :jpdfium-bom:publishAllPublicationsToGithubPackagesRepository \
            :jpdfium-spring:publishAllPublicationsToGithubPackagesRepository \
            :jpdfium-natives:jpdfium-natives-linux-x64:publishAllPublicationsToGithubPackagesRepository \
            :jpdfium-natives:jpdfium-natives-linux-arm64:publishAllPublicationsToGithubPackagesRepository \
            :jpdfium-natives:jpdfium-natives-linux-musl-x64:publishAllPublicationsToGithubPackagesRepository \
            :jpdfium-natives:jpdfium-natives-linux-musl-arm64:publishAllPublicationsToGithubPackagesRepository \
            :jpdfium-natives:jpdfium-natives-darwin-x64:publishAllPublicationsToGithubPackagesRepository \
            :jpdfium-natives:jpdfium-natives-darwin-arm64:publishAllPublicationsToGithubPackagesRepository \
            :jpdfium-natives:jpdfium-natives-windows-x64:publishAllPublicationsToGithubPackagesRepository \
            :jpdfium-natives:jpdfium-natives-windows-arm64:publishAllPublicationsToGithubPackagesRepository \
            -Pjpdfium.version=${{ steps.v.outputs.version }} \
            --no-daemon --stacktrace

      - name: Summary
        run: |
          echo "### Published to GitHub Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: \`${{ steps.v.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Repo: <https://github.com/${{ github.repository }}/packages>" >> $GITHUB_STEP_SUMMARY
