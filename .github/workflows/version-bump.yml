name: Post-release version bump

# A release starts with a v*.*.* tag push, which is the same event that
# publishes to Maven Central. Publishing with the default GITHUB_TOKEN does not
# trigger further workflow runs, so a `release: published` trigger would not
# fire reliably; the tag push does.
#
# The changelog is prepared before the tag: the maintainer promotes the
# [Unreleased] entries to the released version, adds the release date, and
# advances the comparison link. This workflow runs after the tag, so it only
# reconciles the version references and the development version and reminds the
# reviewer of the changelog in the pull request body.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to document (for example 1.2.1).'
        required: true
      base:
        description: 'Branch to open the pull request against. Defaults to the repository default branch.'
        required: false
        default: ''

# No permission is needed workflow-wide; the single job asks for what it pushes.
permissions: {}

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    name: Open a documentation pull request
    runs-on: ubuntu-latest
    # The only job here: it needs to push the bump branch, open the pull request
    # for it, and dispatch CI against that branch, so it is granted contents,
    # pull-requests and actions write access.
    permissions:
      contents: write # push the version bump branch
      pull-requests: write # open the documentation pull request
      actions: write # dispatch ci.yml on that pull request
    steps:
      - name: Resolve the released version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BASE: ${{ inputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "ERROR: could not resolve the released version" >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "base=${INPUT_BASE:-$DEFAULT_BRANCH}"
            echo "branch=chore/version-$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Documenting $VERSION against ${INPUT_BASE:-$DEFAULT_BRANCH}"

      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ steps.v.outputs.base }}
          # The push below supplies its own token, so the checkout does not need
          # to keep credentials in the Git configuration.
          persist-credentials: false

      - name: Look for an existing pull request
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.v.outputs.branch }}
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "An open pull request for $BRANCH already exists; nothing to do."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the version references
        id: bump
        if: steps.existing.outputs.found != 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          bash .github/scripts/bump-release-version.sh --version "$VERSION"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Open the pull request
        if: steps.existing.outputs.found != 'true' && steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          BASE: ${{ steps.v.outputs.base }}
          BRANCH: ${{ steps.v.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Update version references to $VERSION"
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # A previous run can have pushed this branch before failing to open the
          # pull request, leaving no open pull request behind. Reuse it only when
          # it carries nothing but commits this workflow authored, and update it
          # against the revision just fetched so a concurrent push fails the lease
          # instead of being discarded.
          if git ls-remote --exit-code --heads "$REMOTE_URL" "$BRANCH" >/dev/null 2>&1; then
            git fetch --quiet "$REMOTE_URL" "$BRANCH"
            EXPECTED="$(git rev-parse FETCH_HEAD)"
            FOREIGN="$(git log --format='%ae' HEAD..FETCH_HEAD |
              grep -v -F '41898282+github-actions[bot]@users.noreply.github.com' || true)"
            OFF_SCRIPT="$(git log --format='%s' HEAD..FETCH_HEAD |
              grep -v -E '^(chore: )?Update version references to ' || true)"
            if [ -n "$FOREIGN" ] || [ -n "$OFF_SCRIPT" ]; then
              echo "ERROR: $BRANCH exists on the remote with commits this workflow did not author." >&2
              echo "Delete it by hand, or re-run once it is gone:" >&2
              git log --oneline HEAD..FETCH_HEAD >&2
              exit 1
            fi
            git push "$REMOTE_URL" --force-with-lease="refs/heads/$BRANCH:$EXPECTED" "HEAD:refs/heads/$BRANCH"
          else
            git push "$REMOTE_URL" "HEAD:refs/heads/$BRANCH"
          fi
          {
            echo "JPDFium $VERSION is released, so the documented version references now point at it,"
            echo "and \`gradle.properties\` is reconciled with the development version (see the diff)."
            echo
            echo "Before merging, check that the changelog lists $VERSION under its own heading with"
            echo "a release date and an advanced comparison link."
            echo
            echo "Generated by the post-release version bump workflow."
            echo
            echo "Merge once $VERSION is live on Maven Central."
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "Update version references to $VERSION" \
            --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Dispatch the CI workflow on the pull request
        # A pull request opened with GITHUB_TOKEN does not start its own
        # `pull_request` runs, so the required checks would never appear and it
        # would wait on them forever; dispatch them explicitly instead. This runs
        # for an existing pull request too, because a rerun after a failed
        # dispatch has to be able to schedule the run the first attempt never
        # started. Only ci.yml is dispatched here: the other workflows are left
        # alone, so add them below if one of their checks becomes required.
        if: steps.existing.outputs.found == 'true' || steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.v.outputs.branch }}
        run: |
          HEAD_SHA="$(gh pr view "$BRANCH" --json headRefOid --jq .headRefOid)"
          if [ -z "$HEAD_SHA" ]; then
            echo "ERROR: no open pull request for $BRANCH to schedule checks for" >&2
            exit 1
          fi

          # The state of the runs matters, not how many there are: a queued or
          # successful run already covers this revision, while a cancelled or
          # timed-out one never finished and a failed one needs a look instead
          # of a copy.
          RUNS="$(gh run list --workflow ci.yml --limit 200 \
            --json headSha,status,conclusion \
            --jq "[.[] | select(.headSha == \"$HEAD_SHA\")]")"
          echo "ci.yml runs for $HEAD_SHA:"
          printf '%s' "$RUNS" |
            jq -r 'if length == 0 then "  (none)" else (.[] | "  \(.status)/\(.conclusion // "-")") end'

          if printf '%s' "$RUNS" |
            jq -e 'any(.[]; .status != "completed" or .conclusion == "success")' >/dev/null; then
            echo "ci.yml already covers $HEAD_SHA; not dispatching another."
            exit 0
          fi

          if printf '%s' "$RUNS" |
            jq -e 'any(.[]; .status == "completed" and .conclusion == "failure")' >/dev/null; then
            echo "ERROR: the ci.yml run for $HEAD_SHA failed; fix the branch and" >&2
            echo "re-run this workflow, or re-run that run, instead of copying it." >&2
            exit 1
          fi

          gh workflow run ci.yml --ref "$BRANCH"
          echo "Dispatched a replacement ci.yml run for $HEAD_SHA."
