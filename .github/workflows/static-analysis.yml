name: Static Analysis

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  java-analysis:
    name: Java - SpotBugs + Checkstyle + PMD + Spotless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-java@1dbac3c9e137b6d4d280bae1ae4e9902bb4ce1b9 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Build stub bridge
        run: bash native/build-stub.sh

      - name: Full Java Verification (Checkstyle, PMD, SpotBugs, Spotless, javac -Werror)
        run: ./gradlew check --no-daemon

  cpp-analysis:
    name: C++ - clang-tidy + cppcheck + clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Install analysers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cppcheck clang-format build-essential cmake ninja-build pkg-config \
            libpcre2-dev libfreetype6-dev libharfbuzz-dev libicu-dev libqpdf-dev libpugixml-dev libunibreak-dev
      - name: clang-format check
        run: |
          FILES=$(find native/bridge -type f \( -name "*.cpp" -o -name "*.h" \))
          clang-format --dry-run --Werror $FILES

      - name: cppcheck
        run: |
          cppcheck --enable=warning,performance,portability \
            --inline-suppr --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            -I native/bridge/include \
            native/bridge/src 2>&1 | tee /tmp/cppcheck.txt

      - name: clang-tidy
        run: |
          cmake -S native -B /tmp/build-tidy -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DENABLE_CLANG_TIDY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/build-tidy
