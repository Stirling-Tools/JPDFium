name: Bundling

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '9 4 * * 1'

permissions:
  contents: read

jobs:
  bundle-verify:
    name: Bundle verify (symbols, RPATH, linkage, sizes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake patchelf binutils
      - run: bash native/build-stub.sh
      - run: ./gradlew publishToMavenLocal -Pjpdfium.version=0.0.0-bundle-check --no-daemon
      - name: Verify jars contain natives + native-libs.txt
        run: |
          for plat in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
            JAR=$(find ~/.m2/repository/com/stirling/jpdfium-natives-$plat -name "*.jar" ! -name "*-sources*" ! -name "*-javadoc*" | head -n1 || true)
            if [ -z "$JAR" ]; then echo "No jar for $plat (ok in stub)"; continue; fi
            echo "=== $plat: $JAR ==="
            jar tf "$JAR" | grep -E "natives/|native-libs" | head -n 30 || true
          done
      - name: Check RUNPATH/RPATH and linkage leakage (Linux stub only)
        run: |
          SO=$(find jpdfium-natives -name "*.so" -o -name "*.so.*" | head -n1 || true)
          if [ -z "$SO" ]; then echo "No .so to inspect (stub may not produce one here)"; exit 0; fi
          echo "Inspecting $SO"
          readelf -d "$SO" 2>/dev/null | grep -i -E "rpath|runpath" || echo "No RPATH/RUNPATH (expected for stub)"
          ldd "$SO" 2>&1 | head -n 60 || true
      - name: SBOM (cyclonedx) — informational
        continue-on-error: true
        run: |
          ./gradlew cyclonedxBom --no-daemon || echo "cyclonedx plugin not configured — add org.cyclonedx.bom when ready"
          ls -R build/reports/cyclonedx 2>/dev/null | head -n 40 || true
      - name: Binary size report
        run: |
          find ~/.m2/repository/com/stirling -name "*.jar" ! -name "*-sources*" ! -name "*-javadoc*" -exec ls -lh {} \; | awk '{print $5, $9}' | sort -k2
      - name: Licenses check
        run: bash .github/scripts/check-licenses.sh || true

  # The bundled natives jar must be consumable in restricted environments
  # (Debian LXC, Proxmox, Nix sandboxes): no bundled ELF lib may demand an
  # executable stack (GNU_STACK RWE - those kernels refuse to load it with
  # "cannot enable executable stack"), and every bundled lib's dependencies
  # must be self-contained (bundled or core system libs) so the whole thing
  # loads when only libc is present. Regression gate: builds the real linux-x64
  # natives, bundles the full dep set, runs both checks, and proves they load
  # via the production NativeLoader.
  restricted-env-compat:
    name: Restricted-env compat (no execstack + hermetic bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0
      - name: Install build deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libpcre2-dev libfreetype6-dev libharfbuzz-dev libicu-dev \
            libqpdf-dev libpugixml-dev libunibreak-dev \
            lld patchelf binutils
      - name: Fetch prebuilt PDFium (pinned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash native/fetch-prebuilt-pdfium.sh linux-x64
      - name: Build real native bridge
        run: bash native/build-real.sh
      - name: Stage binaries (bridge + PDFium siblings)
        run: |
          mkdir -p native/dist/linux-x64
          find native/build-real -maxdepth 3 -type f \( \
                -name 'libjpdfium.*' -o -name 'jpdfium.dll' \
             \) -exec cp -v {} native/dist/linux-x64/ \;
          find native/pdfium/lib -maxdepth 1 -type f -name 'lib*.so*' \
            -exec cp -v {} native/dist/linux-x64/ \;
      - name: Bundle runtime deps (runs both hermeticity gates)
        run: |
          bash native/bundle-runtime-deps.sh linux-x64
          echo "--- bundled libs ---"
          ls -la native/dist/linux-x64/
      - name: Gate - no bundled lib may require an executable stack
        run: bash native/check-no-execstack.sh native/dist/linux-x64
      - name: Gate - bundle must be hermetic (deps bundled or core system libs)
        run: bash native/check-bundle-hermetic.sh native/dist/linux-x64
      - name: Report GNU_STACK + dependency closure
        run: |
          for f in native/dist/linux-x64/lib*.so*; do
            [ -e "$f" ] || continue
            echo "$(basename "$f"): $(readelf -lW "$f" | awk '/GNU_STACK/{print $NF}')"
          done
          echo "--- ldd on the bridge (must resolve to the bundle) ---"
          ldd native/dist/linux-x64/libjpdfium.so 2>&1 | head -n 40
      - name: Load + operate smoke via production NativeLoader
        run: ./gradlew :jpdfium:nativeSmokeTest -Pjpdfium.testNatives=linux-x64 --no-daemon --stacktrace
