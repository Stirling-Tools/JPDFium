# TEMPORARY - delete before merging jpdfium-fixes.
# Proves the #6869 fix end-to-end: build-minimal-icu.sh must produce a
# libicudata that does NOT demand an executable stack (loadable in LXC).
name: TEMP icu execstack test

on:
  push:
    branches: [jpdfium-fixes]

jobs:
  icu-execstack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ICU tooling
        run: sudo apt-get update && sudo apt-get install -y libicu-dev icu-devtools patchelf

      - name: Build trimmed libicudata
        run: bash native/build-minimal-icu.sh

      - name: Assert no executable stack
        run: |
          LIB=$(find native/dist -name "libicudata.so.*" -type f | head -1)
          if [ -z "$LIB" ]; then
            echo "FAIL: no trimmed libicudata produced (script bailed early?)"
            exit 1
          fi
          echo "Checking $LIB"
          readelf -lW "$LIB" | grep GNU_STACK || { echo "FAIL: no GNU_STACK header"; exit 1; }
          if readelf -lW "$LIB" | grep GNU_STACK | grep -q RWE; then
            echo "FAIL: library still demands an executable stack"
            exit 1
          fi
          echo "PASS: GNU_STACK is non-executable"
