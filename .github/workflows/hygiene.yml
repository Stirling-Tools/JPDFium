name: Hygiene

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gradle-wrapper:
    name: Gradle wrapper validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3.5.0

  javadoc:
    name: Javadoc builds cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-java@816722acf8fd27c9d1e9ae6ee6085da07e0d44c1 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@1cff18a4cfab5cd8d4c49a8ccf11c1ad18bb30b9 # v6.3.0
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - run: bash native/build-stub.sh
      - name: Build Javadoc
        # Maven Central rate-limits shared-runner IPs (HTTP 429) mid-download;
        # the shared wrapper retries those and fails fast on real doc errors.
        run: bash .github/scripts/retry.sh 3 --delay 20 -- ./gradlew javadoc --no-daemon

  editorconfig:
    name: EditorConfig + whitespace hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
      - name: Run editorconfig-checker
        run: editorconfig-checker

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@b4f136db4a9d2ffff88d04cf1328773cb4a1c7ab # v24.2.0
        with:
          globs: 'README.md,CONTRIBUTING.md,docs/**/*.md'

  shellcheck:
    # The name is kept stable so branch protection rules keep matching; the job
    # now checks every tracked script, not only `.github/scripts` and `native/`.
    name: Shellcheck (scripts + native/*.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck all shell scripts (warnings are failures)
        run: |
          # Every tracked script, so a new directory such as native/ci/ cannot
          # escape the check by not being listed here.
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning

  natives-jar-check:
    name: Native jar checker regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          # These jobs only read the tree, so the checkout must not leave the
          # workflow token in the Git configuration.
          persist-credentials: false
      - name: Run the native jar checker regression tests
        run: bash .github/scripts/check-natives-jars-self-test.sh

  version-bump-check:
    name: Version bump script regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - name: Run the version bump script regression tests
        run: bash .github/scripts/bump-release-version-self-test.sh
