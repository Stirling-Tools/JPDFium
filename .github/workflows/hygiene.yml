name: Hygiene

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gradle-wrapper:
    name: Gradle wrapper validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3.5.0

  javadoc:
    name: Javadoc builds cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - run: bash native/build-stub.sh
      - run: ./gradlew javadoc --no-daemon

  editorconfig:
    name: EditorConfig + whitespace hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: editorconfig-checker/action-editorconfig-checker@840e866d93b8e032123c23bac69dece044d4d84c # v2.2.0
        with:
          exclude: '\.gradle/|build/|\.git/|native/pdfium/'

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@83c6b49590003d85b71ea0e478b36aa0a9bb3cd4 # v24.2.0
        with:
          globs: 'README.md,CONTRIBUTING.md,docs/**/*.md'

  shellcheck:
    name: Shellcheck (scripts + native/*.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # 2.0.0
        with:
          scandir: '.github/scripts'
          additional_args: --severity=warning
