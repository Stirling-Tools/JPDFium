name: Hygiene

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gradle-wrapper:
    name: Gradle wrapper validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3.5.0

  javadoc:
    name: Javadoc builds cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-java@2a69be27b0baa8a7ec1c0ba665dc022b180664c5 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@ecf8cf2dcee84990dee44a7479c2b268de61e38d # v6.3.0
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - run: bash native/build-stub.sh
      - name: Build Javadoc
        run: |
          set -o pipefail
          # Maven Central rate-limits shared-runner IPs (HTTP 429) mid-download;
          # retry those and fail immediately on a real Javadoc/source error.
          LOG="$RUNNER_TEMP/javadoc.log"
          for attempt in 1 2 3; do
            if ./gradlew javadoc --no-daemon 2>&1 | tee "$LOG"; then exit 0; fi
            if ! grep -Eq '429|Too Many Requests|Could not (GET|download)|Connection reset|Read timed out' "$LOG"; then
              echo "Javadoc failed for a non-network reason; not retrying"
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Transient dependency download failure (attempt $attempt/3); retrying in 20s"
              sleep 20
            fi
          done
          exit 1

  editorconfig:
    name: EditorConfig + whitespace hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
      - name: Run editorconfig-checker
        run: editorconfig-checker

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@f76d7302a21cbcbf767d5f2ef333ff5ce91371ab # v24.2.0
        with:
          globs: 'README.md,CONTRIBUTING.md,docs/**/*.md'

  shellcheck:
    name: Shellcheck (scripts + native/*.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck all shell scripts (warnings are failures)
        run: |
          shellcheck --severity=warning .github/scripts/*.sh native/*.sh
