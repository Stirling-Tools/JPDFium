name: E2E

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '7 3 * * 2'

permissions:
  contents: read

jobs:
  corpus-e2e:
    name: Corpus + integration e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-java@1dbac3c9e137b6d4d280bae1ae4e9902bb4ce1b9 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - run: bash native/build-stub.sh
      - name: Corpus redaction + determinism + robustness
        run: |
          ./gradlew :jpdfium:test \
            --tests "stirling.software.jpdfium.CorpusRedactTest" \
            --tests "stirling.software.jpdfium.DeterminismTest" \
            --tests "stirling.software.jpdfium.RobustnessTest" \
            --no-daemon --stacktrace

  samples-e2e:
    name: Samples E2E (88 features via RunAllSamples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-java@1dbac3c9e137b6d4d280bae1ae4e9902bb4ce1b9 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - run: bash native/build-stub.sh
      - run: ./gradlew runAllSamples --no-daemon

  flaky-guard:
    name: Flaky-test guard (3× rerun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-java@1dbac3c9e137b6d4d280bae1ae4e9902bb4ce1b9 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - run: bash native/build-stub.sh
      - name: Run tests 3× to surface flakes
        run: |
          for i in 1 2 3; do
            echo "=== run $i/3 ==="
            ./gradlew :jpdfium:test --rerun-tasks --no-daemon || exit 1
          done
          echo "No flake in 3 runs"
