name: Nightly

on:
  schedule:
    # Run at 02:00 UTC every day
    - cron: '0 2 * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch: {}

permissions:
  contents: read

jobs:

  # -------------------------------------------------------------------------
  # Job 1: Extended concurrency soak (200 iterations/thread vs 40 in CI)
  # Runs 16 threads x 200 iterations to catch slow leaks and arena
  # fragmentation that only manifest over long runtimes.
  # -------------------------------------------------------------------------
  soak-concurrency:
    name: Concurrency Soak (16 threads x 200 iterations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge
        run: bash native/build-stub.sh

      - name: Run soak concurrency test (higher iteration count)
        run: |
          ./gradlew :jpdfium:test \
            --tests "stirling.software.jpdfium.ConcurrencyTest" \
            -Djpdfium.soak.iterations=200 \
            --no-daemon --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-soak-reports-${{ github.run_id }}
          path: jpdfium/build/reports/tests/test/

  # -------------------------------------------------------------------------
  # Job 2: Nightly native memory leak check (500 iterations, Linux RSS)
  # -------------------------------------------------------------------------
  nightly-leak-check:
    name: Nightly Native Memory Leak Check (500 cycles, Linux RSS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge
        run: bash native/build-stub.sh

      - name: Run native memory leak tests
        run: |
          ./gradlew :jpdfium:test \
            --tests "stirling.software.jpdfium.NativeMemoryLeakTest" \
            --no-daemon --stacktrace

  # -------------------------------------------------------------------------
  # Job 3: Full robustness + determinism suite
  # -------------------------------------------------------------------------
  nightly-robustness:
    name: Nightly Full Robustness & Determinism Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge
        run: bash native/build-stub.sh

      - name: Robustness corpus
        run: |
          ./gradlew :jpdfium:test \
            --tests "stirling.software.jpdfium.RobustnessTest" \
            --no-daemon --stacktrace

      - name: Determinism suite (72, 150, 300 DPI)
        run: |
          ./gradlew :jpdfium:test \
            --tests "stirling.software.jpdfium.DeterminismTest" \
            --no-daemon --stacktrace

  # -------------------------------------------------------------------------
  # Job 4: JMH benchmark baseline update (main branch only)
  # Runs a longer benchmark and updates the cache baseline used by PR jobs.
  # -------------------------------------------------------------------------
  benchmark-baseline-update:
    name: Update JMH Baseline (main only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # Required to write cache entries
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge
        run: bash native/build-stub.sh

      - name: Run JMH (longer warmup for stable baseline)
        run: |
          ./gradlew :jpdfium:jmh \
            -Pjmh.warmupIterations=5 \
            -Pjmh.iterations=5 \
            --no-daemon

      - name: Copy results as baseline
        run: |
          mkdir -p jpdfium/build/results/jmh
          cp jpdfium/build/results/jmh/results.json jpdfium/build/results/jmh/baseline.json

      - name: Save baseline to cache
        uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: jpdfium/build/results/jmh/baseline.json
          key: jmh-baseline-main

      - name: Upload baseline artifact (long-term retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jmh-baseline-${{ github.run_id }}
          path: jpdfium/build/results/jmh/baseline.json
          retention-days: 90

