name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # Upload SARIF analysis results
    strategy:
      fail-fast: false
      matrix:
        language: ['c-cpp', 'java-kotlin']

    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: manual

      - name: Setup Java 25
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Install jextract
        if: matrix.language == 'java-kotlin'
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Install build deps (Linux, c-cpp)
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libpcre2-dev libfreetype6-dev libharfbuzz-dev libicu-dev icu-devtools \
            libqpdf-dev libpugixml-dev libunibreak-dev lld
      - name: Fetch prebuilt PDFium (c-cpp)
        if: matrix.language == 'c-cpp'
        run: bash native/fetch-prebuilt-pdfium.sh linux-x64

      - name: Build C++
        if: matrix.language == 'c-cpp'
        run: bash native/build-real.sh

      - name: Build C++ stub (java-kotlin)
        if: matrix.language == 'java-kotlin'
        run: bash native/build-stub.sh

      - name: Build Java
        if: matrix.language == 'java-kotlin'
        run: ./gradlew :jpdfium:compileJava --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
