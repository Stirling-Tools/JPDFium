name: Snapshot to Central Portal

on:
  push:
    branches: [main, publishing-setup]   # publishing-setup temporary, for bring-up testing
  # On PRs we build the real natives per platform and run the functional smoke
  # (load + open a PDF), but never publish - so every PR is verified against the
  # actual artifact, not just a compile.
  pull_request: {}
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'PDFium build mode (default: component, fast iteration; static: matches release.yml, smaller jars)'
        type: choice
        options: [component, static]
        default: component
      skip_publish:
        description: 'Dry run: build + sign + upload artifacts but do NOT publish to Central Portal (use to verify signing without shipping)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fail fast BEFORE the ~25-min natives matrix if the pinned PDFium prebuild
  # release is missing required assets. Without this, a missing
  # pdfium-<platform>.tar.gz surfaces only after each leg's 20+ min build, and
  # every PR burns the whole matrix before failing.
  preflight-assets:
    name: Preflight - pinned PDFium release assets
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Verify prebuilt PDFium assets exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(grep -v '^#' native/pdfium.version | grep -v '^$' | head -n1 || true)
          [ -n "$TAG" ] || { echo "::error::native/pdfium.version is empty - run the Prebuild PDFium workflow first"; exit 1; }
          echo "Pinned PDFium prebuild: $TAG"
          # PDFium prebuilds live in the UPSTREAM repo (this fork may not carry
          # the pdfium-* release); fall back exactly like fetch-prebuilt-pdfium.sh.
          ASSETS=""
          for repo in "$GITHUB_REPOSITORY" "Stirling-Tools/JPDFium"; do
            ASSETS=$(gh release view "$TAG" --repo "$repo" --json assets --jq '.assets[].name' 2>/dev/null || true)
            [ -n "$ASSETS" ] && { echo "assets from $repo"; break; }
          done
          [ -n "$ASSETS" ] || {
            echo "::error::release $TAG not found in $GITHUB_REPOSITORY or Stirling-Tools/JPDFium - run Prebuild PDFium / merge its pin PR"; exit 1;
          }
          # Required platforms (component + static): missing -> fail fast.
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
            for suffix in "" -static; do
              echo "$ASSETS" | grep -qx "pdfium-$p$suffix.tar.gz" || {
                echo "::error::missing required prebuild asset pdfium-$p$suffix.tar.gz in release $TAG - run Prebuild PDFium / merge its pin PR"; exit 1;
              }
            done
          done
          # musl is experimental (Prebuild PDFium treats linux-musl-* as
          # warn-only) - missing assets skip the musl legs, never fail.
          for p in linux-musl-x64 linux-musl-arm64; do
            if echo "$ASSETS" | grep -qx "pdfium-$p.tar.gz"; then
              echo "musl prebuild $p: present"
            else
              echo "::warning::musl prebuild pdfium-$p.tar.gz missing - linux-musl-* natives will be skipped this run"
            fi
          done
          echo "Preflight OK"

  # Cross-build a trimmed Windows icudt78.dll on Linux ahead of the matrix
  # so the windows-x64 job can download it as an artifact during its own
  # build. The matrix can't have per-cell needs:, so we do this as a
  # separate prep job that the matrix depends on. ~5-7 min CI overhead;
  # saves ~25 MB on the windows-x64 natives jar.
  prep-windows-icu:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Install build deps (Linux + mingw-w64)
        run: |
          sudo sed -i \
            -e 's|http://ports\.ubuntu\.com|http://azure.ports.ubuntu.com|g' \
            -e 's|http://archive\.ubuntu\.com|http://azure.archive.ubuntu.com|g' \
            -e 's|http://security\.ubuntu\.com|http://azure.archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y \
              build-essential icu-devtools libicu-dev \
              mingw-w64 binutils-mingw-w64 \
              curl unzip && exit 0
            sleep 30
          done
          exit 1
      - name: Cross-build minimal Windows icudt78.dll
        run: bash native/build-minimal-icu-windows.sh
      - name: Upload trimmed Windows icudt78.dll
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-icu-trimmed
          path: native/dist/windows-x64/icudt78.dll
          if-no-files-found: warn  # script bails out -> windows job uses vcpkg's full 33 MB dll
          retention-days: 1
      - name: Upload bare trimmed ICU .dat (for macOS wrap step)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icu-data-trimmed
          path: native/dist/icu-data/icudt*l.dat
          if-no-files-found: warn  # macOS jobs fall back to brew's 33 MB libicudata
          retention-days: 1

  build-natives:
    needs: [preflight-assets, prep-windows-icu]
    if: always()  # build even if prep failed; windows job falls back to vcpkg's full icudt78.dll
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    runner: ubuntu-latest    }
          - { platform: linux-arm64,  runner: ubuntu-24.04-arm }
          # musl / Alpine (linux-musl-*). Built inside a matching-arch Alpine
          # container (eclipse-temurin:25-jdk-alpine = musl JDK) via docker run
          # from the host - GitHub cannot run JS actions in Alpine containers on
          # arm64 runners, so there is no job-level container here. Consumes the
          # musl PDFium prebuilds from prebuild-pdfium.yml. arm64 uses a native
          # arm64 runner.
          - { platform: linux-musl-x64,   runner: ubuntu-latest,    libc: musl }
          - { platform: linux-musl-arm64, runner: ubuntu-24.04-arm, libc: musl }
          # darwin-x64 cross-compiles from macos-14 (arm64 host) with an
          # x86_64 Homebrew installed at /usr/local under Rosetta.
          - { platform: darwin-x64,   runner: macos-14         }
          - { platform: darwin-arm64, runner: macos-14         }
          - { platform: windows-x64,  runner: windows-latest   }
          - { platform: windows-arm64, runner: windows-11-arm  }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        # The musl legs build + smoke inside an Alpine container which ships its
        # own musl JDK - a glibc host JDK is neither needed nor usable there.
        if: matrix.libc != 'musl'
        with:
          # Temurin does not publish JDK 25 for Windows aarch64; Microsoft
          # Build of OpenJDK does, so use it on the windows-arm64 leg.
          distribution: ${{ matrix.platform == 'windows-arm64' && 'microsoft' || 'temurin' }}
          java-version: '25'

      - name: Install build deps (Linux)
        if: startsWith(matrix.platform, 'linux-') && matrix.libc != 'musl'
        # ports.ubuntu.com (the arm64 mirror) has multi-hour network outages
        # ~weekly (seen May 2026 - Connection failed [IP: 91.189.91.10x] across
        # 30+ min). Switch to the Azure mirror which is network-adjacent to GH
        # runners. azure.ports.ubuntu.com proxies ports.ubuntu.com; same for
        # archive.ubuntu.com -> azure.archive.ubuntu.com on x64.
        # Also retry 3x in case the Azure mirror has its own glitch.
        #
        # mingw-w64 + binutils-mingw-w64 lets the Linux x64 job cross-build
        # a Windows icudt78.dll (Task #7 - drops ~28 MB of unused ICU data
        # from the windows-x64 natives jar). meson + ninja-build for the
        # harfbuzz-without-glib rebuild (drops libglib).
        run: |
          sudo sed -i \
            -e 's|http://ports\.ubuntu\.com|http://azure.ports.ubuntu.com|g' \
            -e 's|http://archive\.ubuntu\.com|http://azure.archive.ubuntu.com|g' \
            -e 's|http://security\.ubuntu\.com|http://azure.archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y \
              build-essential cmake ninja-build pkg-config meson \
              libpcre2-dev libfreetype6-dev libharfbuzz-dev libicu-dev icu-devtools \
              libqpdf-dev libpugixml-dev libunibreak-dev \
              mingw-w64 binutils-mingw-w64 \
              lld \
              patchelf && exit 0
            echo "apt install attempt $attempt failed; retrying in 30s..." >&2
            sleep 30
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1

      - name: Install build deps (macOS, native arm64)
        if: matrix.platform == 'darwin-arm64'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          brew install cmake ninja \
            pcre2 freetype harfbuzz icu4c qpdf pugixml libunibreak \
            pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install build deps (macOS, x86_64 cross-compile)
        if: matrix.platform == 'darwin-x64'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
          if [ ! -x /usr/local/bin/brew ]; then
            arch -x86_64 /bin/bash -c \
              'NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL --max-time 120 https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
          fi
          arch -x86_64 /usr/local/bin/brew install \
            pcre2 freetype harfbuzz icu4c qpdf pugixml libunibreak pkg-config
          {
            echo "PKG_CONFIG_PATH=/usr/local/opt/icu4c/lib/pkgconfig:/usr/local/lib/pkgconfig"
            echo "PKG_CONFIG=/usr/local/bin/pkg-config"
            echo "CMAKE_OSX_ARCHITECTURES=x86_64"
          } >> "$GITHUB_ENV"

      - name: Cache vcpkg binary packages
        if: startsWith(matrix.platform, 'windows-')
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-binary-${{ matrix.platform }}-${{ hashFiles('native/vcpkg-overlay/**', '.github/workflows/snapshot.yml') }}
          restore-keys: vcpkg-binary-${{ matrix.platform }}-

      - name: Install build deps (Windows)
        if: startsWith(matrix.platform, 'windows-')
        run: |
          choco install -y cmake --version=4.4.2
          choco install -y ninja --version=1.13.2
          if command -v pkg-config >/dev/null 2>&1; then
            echo "pkg-config already on PATH"
          elif [ -f "C:/Strawberry/c/bin/pkg-config.exe" ]; then
            echo "C:/Strawberry/c/bin" >> "$GITHUB_PATH"
          else
            choco install -y pkgconf || choco install -y pkgconfiglite || true
          fi
          echo "VCPKG_BINARY_SOURCES=files,${{ runner.temp }}/vcpkg-binary-cache,readwrite" >> "$GITHUB_ENV"
          # vcpkg installs into a triplet-scoped tree. Pick the triplet that
          # matches the target arch so the bridge + bundler resolve the right
          # DLLs (arm64-windows on windows-11-arm runners, x64-windows on x64).
          # vcpkg-install.sh adds our freetype overlay port (GitHub mirror, the
          # stock gitlab.freedesktop.org source is chronically flaky) + retries.
          if [ "${{ matrix.platform }}" = "windows-arm64" ]; then
            TRIPLET="arm64-windows"
            PLAT_GEN="ARM64"
          else
            TRIPLET="x64-windows"
            PLAT_GEN="x64"
          fi
          bash native/vcpkg-install.sh \
            pkgconf:$TRIPLET \
            pcre2:$TRIPLET freetype:$TRIPLET harfbuzz:$TRIPLET \
            icu:$TRIPLET qpdf:$TRIPLET pugixml:$TRIPLET \
            libunibreak:$TRIPLET
          {
            echo "CMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
            echo "PKG_CONFIG_PATH=$VCPKG_INSTALLATION_ROOT/installed/$TRIPLET/lib/pkgconfig"
            echo "VCPKG_TARGET_TRIPLET=$TRIPLET"
            echo "CMAKE_GENERATOR_PLATFORM=$PLAT_GEN"
          } >> "$GITHUB_ENV"
          echo "$VCPKG_INSTALLATION_ROOT/installed/$TRIPLET/tools/pkgconf" >> "$GITHUB_PATH"

      - name: Fetch prebuilt PDFium (pinned)
        id: fetch
        # The musl PDFium prebuilds are experimental (Prebuild PDFium's release
        # sanity check treats linux-musl-* as warn-only). Until that workflow is
        # green, a missing pdfium-linux-musl-*.tar.gz must SKIP the musl legs,
        # not fail every PR - the skip is surfaced by the step below.
        continue-on-error: ${{ matrix.libc == 'musl' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Default to component (fast PR iteration). Manual workflow_dispatch
          # can override to "static" to sanity-check the release.yml path.
          JPDFIUM_BUILD_MODE: ${{ inputs.build_mode || 'component' }}
        run: bash native/fetch-prebuilt-pdfium.sh ${{ matrix.platform }}

      # musl legs run the ENTIRE native build + smoke inside an Alpine container
      # via docker run from the host (GitHub cannot host JS actions in Alpine
      # containers on arm64 runners, so no job-level `container:`). One container
      # run does bootstrap + rebuild deps + bridge + stage + bundle + smoke, so
      # the ~1 GB apk bootstrap happens once. The smoke INITS the native and
      # opens a PDF on the musl JVM - the linux-musl-* leg is red until both pass.
      - name: Build + smoke musl natives (Alpine container)
        id: musl
        if: matrix.libc == 'musl' && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Shipped jar: the musl bundle must be held to the strict size gate too.
          SIZE_GATE_STRICT: '1'
        run: bash native/ci/alpine-exec.sh ${{ matrix.platform }} natives smoke

      - name: Skip musl natives (missing musl PDFium prebuild)
        if: matrix.libc == 'musl' && steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::linux-musl-* natives skipped: pdfium-linux-musl-*.tar.gz is not in the pinned PDFium prebuild release yet."
          echo "Run the 'Prebuild PDFium' workflow to produce it; once that is green the musl natives build + smoke resumes."
          echo "The glibc/darwin/windows legs are unaffected."

      - name: Build qpdf with native crypto (Linux + macOS)
        if: matrix.libc != 'musl' && (startsWith(matrix.platform, 'linux-') || startsWith(matrix.platform, 'darwin-'))
        # Rebuild libqpdf with --with-crypto=native to drop the crypto
        # transitive chain:
        #   Linux   apt libqpdf-dev is GNUTLS-built - drops libgnutls +
        #           libnettle + libgmp + libp11-kit + libidn2 + libunistring +
        #           libtasn1 + libbrotli* ≈ 7-8 MB.
        #   macOS   brew libqpdf is OpenSSL-built - drops libcrypto.3.dylib
        #           ≈ 4.85 MB.
        # Must run BEFORE build-real.sh so the bridge links against the new
        # /usr/local (Linux) or $(brew --prefix) (macOS) libqpdf.
        run: bash native/build-qpdf-native-crypto.sh

      - name: Build harfbuzz without GLib (Linux + macOS)
        if: matrix.libc != 'musl' && (startsWith(matrix.platform, 'linux-') || startsWith(matrix.platform, 'darwin-'))
        # Rebuild libharfbuzz with all language bindings disabled to drop
        # libglib (~1.4 MB on Linux, ~1.25 MB + libintl ~230 KB on macOS).
        # apt's libharfbuzz0b and brew's harfbuzz both link glib for the
        # hb-glib bindings we don't use; the bridge calls plain hb_*.
        run: bash native/build-harfbuzz-no-glib.sh

      - name: Cache cargo registry & Rust target
        if: matrix.libc != 'musl'
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/rust/target
          key: cargo-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('native/rust/Cargo.lock') }}

      - if: matrix.libc != 'musl'
        run: bash native/build-real.sh

      - name: Build minimal ICU data (Linux)
        if: startsWith(matrix.platform, 'linux-') && matrix.libc != 'musl'
        # Strips ~25 MB of unused ICU data (locales, currencies, collations,
        # RBNF, ...) and repackages libicudata.so. The bundler step will then
        # pick up the trimmed lib via ldd on the bridge. JPDFIUM_TARGET_PLATFORM
        # makes the trimmed lib land in the right natives dist dir on the musl
        # legs (linux-musl-*) too.
        env:
          JPDFIUM_TARGET_PLATFORM: ${{ matrix.platform }}
        run: bash native/build-minimal-icu.sh

      - name: Download bare trimmed ICU .dat (macOS)
        # brew icu4c@78 doesn't ship icupkg/pkgdata, so we don't trim
        # locally; we download the pre-trimmed .dat produced once on Linux
        # by the prep-windows-icu job and wrap it on macOS via clang. The
        # .dat is platform-agnostic.
        if: startsWith(matrix.platform, 'darwin-')
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        continue-on-error: true        # missing -> macOS bundler falls back to brew's 33 MB libicudata
        with:
          name: icu-data-trimmed
          path: native/dist/icu-data/

      - name: Build minimal ICU data (macOS)
        if: startsWith(matrix.platform, 'darwin-')
        # Wraps the downloaded icudt78l.dat into a libicudata.<MAJ>.dylib
        # via a clang .incbin asm stub. Pre-stages into native/dist/<platform>/
        # so the bundler picks it up instead of brew's full 33 MB copy. Also
        # fixes a latent gap on darwin-arm64 where bundle_macos couldn't
        # resolve libicudata through brew's keg-only icu4c@78 path.
        run: bash native/build-minimal-icu-macos.sh

      - name: Import macOS signing certificate
        # Signing is a publish concern. Skip on PRs AND when no cert secret is
        # configured (forks / dev) - the smoke loads the freshly-built unsigned
        # dylib on the same runner just fine. On the upstream (with the cert)
        # the import runs so the bundled dylibs are signed + notarizable.
        if: startsWith(matrix.platform, 'darwin-') && github.event_name != 'pull_request'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            echo "::warning::no macOS signing cert configured - darwin natives will be UNSIGNED (fork/dev CI)"
            echo "MACOS_ALLOW_UNSIGNED=1" >> "$GITHUB_ENV"
          else
            bash native/import-macos-cert.sh
          fi

      - name: Stage binaries (bridge + PDFium siblings)
        if: matrix.libc != 'musl'
        run: |
          mkdir -p native/dist/${{ matrix.platform }}
          find native/build-real -maxdepth 3 -type f \( \
                -name 'libjpdfium.*' -o -name 'jpdfium.dll' \
             \) -exec cp -v {} native/dist/${{ matrix.platform }}/ \;
          # Component-built PDFium siblings (libabsl, icuuc, libpng, libc++ ...).
          # Filter out Windows debug helpers that PDFium's gn build pulls into
          # out/Release/ (dbghelp.dll, msdia140.dll, symsrv.dll, dbgcore.dll,
          # vccorlib140.dll) - not runtime deps, ~5 MB of waste.
          if [ -d native/pdfium/lib ]; then
            find native/pdfium/lib -maxdepth 1 -type f \( \
                  -name '*.dll' -o -name 'lib*.so' -o -name 'lib*.so.*' -o -name 'lib*.dylib' \
               \) \
               ! -name 'dbghelp.dll' ! -name 'dbgcore.dll' \
               ! -name 'msdia*.dll'   ! -name 'symsrv.dll' \
               ! -name 'vccorlib*.dll' \
               -exec cp -v {} native/dist/${{ matrix.platform }}/ \;
          fi

      - name: Override icudt78.dll with trimmed copy (Windows only)
        # Run AFTER the PDFium-siblings find above (which would copy PDFium's
        # 33 MB icudt78.dll) and BEFORE the bundler so the small trimmed copy
        # wins. download-artifact@v4 extracts on top, overwriting the larger
        # one.
        if: matrix.platform == 'windows-x64'
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        continue-on-error: true        # missing artifact -> stay with PDFium's full 33 MB icudt78.dll
        with:
          name: windows-icu-trimmed
          path: native/dist/windows-x64/

      - name: Bundle runtime deps + strip
        if: matrix.libc != 'musl'
        env:
          # PRs and cert-less (fork/dev) builds have no signing cert; unsigned
          # is fine because the smoke loads the freshly-built dylib on the same
          # runner. The upstream publish has the cert, so signing is enforced.
          MACOS_ALLOW_UNSIGNED: ${{ (github.event_name == 'pull_request' || secrets.MACOS_CERTIFICATE_P12_BASE64 == '') && '1' || '' }}
          # Shipped jar: a platform with no size budget entry must FAIL, not
          # silently disable the gate.
          SIZE_GATE_STRICT: '1'
        run: |
          # Bridge runtime deps - walk the bridge's import table and copy
          # only what's actually referenced, skipping system libs. Also
          # strips debug symbols from the bridge. Bundler's "skip if dest
          # exists" guard preserves any pre-staged trimmed files (Linux
          # libicudata.so.74 / Windows icudt78.dll).
          bash native/bundle-runtime-deps.sh ${{ matrix.platform }}
          ls -la native/dist/${{ matrix.platform }}/

      # Functionally verify the freshly-built native instead of trusting that a
      # file was produced: load it via the production NativeLoader and open a
      # PDF. Skips: darwin-x64 (cross-compiled on an arm64 host, can't run here),
      # and all darwin on PRs (macOS rejects the unsigned dylib - signing only
      # runs on push/release). Linux + Windows don't need signing, so they smoke
      # on every PR.
      - name: Install jextract (for smoke build)
        # No windows-aarch64 jextract build exists (download.java.net ships
        # windows-x64 only), but the FFM bindings are committed in-repo, so the
        # windows-arm64 smoke uses them directly and can skip jextract. Same for
        # musl: jextract only ships glibc builds, so the musl smoke uses the
        # committed bindings (generateBindings is skipped when jextract is
        # absent).
        if: matrix.platform != 'darwin-x64' && matrix.platform != 'windows-arm64' && matrix.libc != 'musl' && (github.event_name != 'pull_request' || !startsWith(matrix.platform, 'darwin-'))
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   if [ "$(uname -m)" = aarch64 ]; then JX=openjdk-25-jextract+2-4_linux-aarch64_bin.tar.gz; else JX=openjdk-25-jextract+2-4_linux-x64_bin.tar.gz; fi ;;
            macOS)   if [ "$(uname -m)" = arm64 ]; then JX=openjdk-25-jextract+2-4_macos-aarch64_bin.tar.gz; else JX=openjdk-25-jextract+2-4_macos-x64_bin.tar.gz; fi ;;
            Windows) JX=openjdk-25-jextract+2-4_windows-x64_bin.tar.gz ;;
          esac
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "https://download.java.net/java/early_access/jextract/25/2/$JX" -o /tmp/jx.tar.gz
          tar -xzf /tmp/jx.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Functional smoke test (load native + open a PDF)
        if: matrix.libc != 'musl' && matrix.platform != 'darwin-x64' && (github.event_name != 'pull_request' || !startsWith(matrix.platform, 'darwin-'))
        run: ./gradlew :jpdfium:nativeSmokeTest -Pjpdfium.testNatives=${{ matrix.platform }} --no-daemon --stacktrace
        timeout-minutes: 60

      - name: Verify native smoke actually ran
        if: always() && matrix.libc != 'musl' && matrix.platform != 'darwin-x64' && (github.event_name != 'pull_request' || !startsWith(matrix.platform, 'darwin-'))
        run: bash native/ci/check-smoke-ran.sh jpdfium/build/test-results/nativeSmokeTest

      # darwin-x64 is cross-compiled on this arm64 (macos-14) host; on push /
      # release the dylib is signed, so run its x86_64 smoke under Rosetta with
      # an x86_64 JDK (skipped on PRs where macOS rejects the unsigned dylib).
      - name: Functional smoke test - darwin-x64 (Rosetta)
        if: matrix.platform == 'darwin-x64' && github.event_name != 'pull_request'
        shell: bash
        run: |
          curl -fL --max-time 300 --retry 5 --retry-all-errors --retry-delay 3 \
            "https://api.adoptium.net/v3/binary/latest/25/ga/mac/x64/jdk/hotspot/normal/eclipse?project=jdk" \
            -o /tmp/x64-jdk.tar.gz
          mkdir -p "$HOME/x64-jdk"
          tar -xzf /tmp/x64-jdk.tar.gz -C "$HOME/x64-jdk" --strip-components=1
          arch -x86_64 "$HOME/x64-jdk/Contents/Home/bin/java" -version
          export JAVA_HOME="$HOME/x64-jdk/Contents/Home"
          arch -x86_64 ./gradlew :jpdfium:nativeSmokeTest -Pjpdfium.testNatives=darwin-x64 --no-daemon --stacktrace
        timeout-minutes: 60

      - name: Verify darwin-x64 smoke actually ran
        if: always() && matrix.platform == 'darwin-x64' && github.event_name != 'pull_request'
        run: bash native/ci/check-smoke-ran.sh jpdfium/build/test-results/nativeSmokeTest

      - name: Verify musl smoke actually ran
        if: always() && matrix.libc == 'musl' && steps.fetch.outcome == 'success'
        run: bash native/ci/check-smoke-ran.sh jpdfium/build/test-results/nativeSmokeTest

      - name: Upload hs_err logs (smoke crash diagnostics)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hs_err-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            jpdfium/hs_err_pid*.log
            jpdfium-natives/**/hs_err_pid*.log
            **/hs_err_pid*.log
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # musl: only upload when the in-container build actually staged natives
        # (skipped legs - missing musl PDFium prebuild - have an empty dist dir).
        if: always() && (matrix.libc != 'musl' || steps.musl.outcome == 'success')
        with:
          name: natives-${{ matrix.platform }}
          path: native/dist/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 3

  # Optional libvips natives for the jpdfium-vips image decoder (HEIC/HEIF/JXL/
  # AVIF/WebP/...). Bring-up: the whole job is continue-on-error so PRs are NOT
  # blocked while the per-platform libvips bundle is being hardened. Publishes
  # nothing yet - add vips natives to publish-snapshot once staging is stable.
  build-vips-natives:
    # The vips smoke renders a real PDF through the core natives, so it needs
    # the per-platform PDFium bundle from build-natives.
    needs: build-natives
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    runner: ubuntu-latest    }
          - { platform: linux-arm64,   runner: ubuntu-24.04-arm }
          - { platform: darwin-arm64, runner: macos-14         }
          - { platform: windows-x64,  runner: windows-latest   }
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0

      # The vips smoke test renders a PDF via the core PDFium natives, so stage
      # that platform's natives bundle next to the vips one.
      - name: Download core natives for ${{ matrix.platform }}
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        continue-on-error: true        # core leg may have failed on this PR
        with:
          name: natives-${{ matrix.platform }}
          path: native/dist/${{ matrix.platform }}/

      - name: Build full-codec libvips (Linux + macOS)
        # The distro libvips (apt/brew) lacks jxlsave/heifsave; build a copy
        # with ALL major codecs so the smoke can render PDF -> every format.
        if: startsWith(matrix.platform, 'linux-') || matrix.platform == 'darwin-arm64'
        continue-on-error: true
        run: bash native/build-vips-full-codecs.sh
      - name: Install libvips (Linux, fallback)
        if: startsWith(matrix.platform, 'linux-') && !cancelled()
        run: |
          # Only needed if the source build above was skipped; keep the apt
          # libvips around so build-vips.sh always finds something.
          [ -f /usr/local/lib/libvips.so.42 ] || \
            sudo apt-get install -y --no-install-recommends libvips-dev patchelf
      - name: Install libvips (macOS, fallback)
        if: matrix.platform == 'darwin-arm64'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          [ -f /usr/local/lib/libvips.42.dylib ] || brew install vips
      - name: Fetch prebuilt libvips (Windows)
        # Asset name/version may need updating to match a current
        # libvips/build-win64-mxe release. Non-blocking (job-level
        # continue-on-error) so a stale URL doesn't fail the PR.
        if: matrix.platform == 'windows-x64'
        run: |
          set -e
          url=$(curl -fsSL https://api.github.com/repos/libvips/build-win64-mxe/releases/latest \
                | grep -oE 'https://[^"]*vips-dev-w64-webp-[0-9.]+\.zip' | head -n1 || true)
          [ -z "$url" ] && { echo "No prebuilt libvips Windows zip found - skipping"; exit 0; }
          curl -fsSL "$url" -o /tmp/vips.zip
          mkdir -p /tmp/vips-win && unzip -q /tmp/vips.zip -d /tmp/vips-win
          echo "VIPS_WIN_DIST=/tmp/vips-win" >> "$GITHUB_ENV"

      - name: Stage libvips + codec chain
        id: stage
        continue-on-error: true
        env:
          MACOS_ALLOW_UNSIGNED: '1'
        run: bash native/build-vips.sh ${{ matrix.platform }}

      - name: Build vips natives jar
        if: steps.stage.outcome == 'success'
        continue-on-error: true
        run: ./gradlew :jpdfium-natives:jpdfium-natives-vips-${{ matrix.platform }}:jar --no-daemon

      # Functional smoke gate: the bundled vips natives must RENDER a real PDF
      # and encode it to every major format (HEIF, HEIC, AVIF, JXL, PNG, JPEG,
      # WEBP, TIFF) before this vips package counts as good. Red (never green)
      # until every format round-trips. Skipped on PRs for darwin (unsigned
      # dylibs on PRs can't load on arm64 macOS).
      - name: Vips smoke test (render PDF -> all major formats)
        if: steps.stage.outcome == 'success' && (github.event_name != 'pull_request' || matrix.platform != 'darwin-arm64')
        run: ./gradlew :jpdfium-vips:vipsSmokeTest -Pjpdfium.testNatives=${{ matrix.platform }} -Pjpdfium.testVipsNatives=vips-${{ matrix.platform }} --no-daemon --stacktrace
        timeout-minutes: 60

      - name: Verify vips smoke actually ran
        if: always() && steps.stage.outcome == 'success' && (github.event_name != 'pull_request' || matrix.platform != 'darwin-arm64')
        run: bash native/ci/check-smoke-ran.sh jpdfium-vips/build/test-results/vipsSmokeTest

      - name: Upload hs_err logs (vips smoke crash diagnostics)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vips-hs_err-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            jpdfium-vips/hs_err_pid*.log
            jpdfium/hs_err_pid*.log
            jpdfium-natives/**/hs_err_pid*.log
            **/hs_err_pid*.log
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.stage.outcome == 'success'
        with:
          name: natives-vips-${{ matrix.platform }}
          path: native/dist/vips-${{ matrix.platform }}/
          if-no-files-found: warn

  publish-snapshot:
    needs: build-natives
    # Skipped on a dry run (workflow_dispatch with skip_publish=true) and never
    # runs on pull_request - PRs build + smoke-test the natives but must not ship.
    if: ${{ inputs.skip_publish != true && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0

      - name: Install jextract
        run: |
          # jpdfium/build.gradle.kts uses jextract to generate JpdfiumH.java
          # (FFM bindings) from native/bridge/include/jpdfium.h. Without it,
          # compileJava fails with `cannot find symbol JpdfiumH`.
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          path: .artifacts
          pattern: natives-*

      - name: Flatten into native/dist/<platform>/
        run: |
          mkdir -p native/dist
          for d in .artifacts/natives-*; do
            plat="${d##*natives-}"
            mkdir -p "native/dist/$plat"
            cp -v "$d"/* "native/dist/$plat/"
          done

      - name: Publish SNAPSHOT
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: |
          # Snapshots use the -SNAPSHOT version from gradle.properties and skip the
          # finalize step - the Central Portal snapshots repo is mutable.
          ./gradlew \
            :jpdfium:publishAllPublicationsToCentralPortalRepository \
            :jpdfium-bom:publishAllPublicationsToCentralPortalRepository \
            :jpdfium-spring:publishAllPublicationsToCentralPortalRepository \
            :jpdfium-natives:jpdfium-natives-linux-x64:publishAllPublicationsToCentralPortalRepository \
            :jpdfium-natives:jpdfium-natives-linux-arm64:publishAllPublicationsToCentralPortalRepository \
            :jpdfium-natives:jpdfium-natives-linux-musl-x64:publishAllPublicationsToCentralPortalRepository \
            :jpdfium-natives:jpdfium-natives-linux-musl-arm64:publishAllPublicationsToCentralPortalRepository \
            :jpdfium-natives:jpdfium-natives-darwin-x64:publishAllPublicationsToCentralPortalRepository \
            :jpdfium-natives:jpdfium-natives-darwin-arm64:publishAllPublicationsToCentralPortalRepository \
            :jpdfium-natives:jpdfium-natives-windows-x64:publishAllPublicationsToCentralPortalRepository \
            :jpdfium-natives:jpdfium-natives-windows-arm64:publishAllPublicationsToCentralPortalRepository \
            --no-daemon --stacktrace
