name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install build deps (Windows)
        if: runner.os == 'Windows'
        run: choco install -y cmake ninja

      # jpdfium/build.gradle.kts uses jextract to generate JpdfiumH.java
      # (FFM bindings) from native/bridge/include/jpdfium.h. Without it,
      # compileJava fails on `cannot find symbol JpdfiumH`. Download the
      # OpenJDK 25 jextract early-access build for the runner's OS.
      - name: Install jextract (Linux)
        if: runner.os == 'Linux'
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"
      - name: Install jextract (macOS)
        if: runner.os == 'macOS'
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_macos-aarch64_bin.tar.gz"
          else
            JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_macos-x64_bin.tar.gz"
          fi
          mkdir -p "$HOME/jextract-install"
          curl -fsSL "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"
      - name: Install jextract (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_windows-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          # build.gradle.kts uses ".bat" suffix on Windows via os.name check.
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge (no PDFium required)
        run: bash native/build-stub.sh

      # PR-time smoke check: compile main + test sources only. The stub
      # bridge ships ~62 of the API's ~90 symbols and is intentionally
      # behind — many tests need the real PDFium native lib loaded via
      # FFM SymbolLookup which the stub doesn't satisfy. Test EXECUTION
      # happens on the snapshot.yml / publish-github-packages.yml pushes
      # (which build the real bridge against the PDFium prebuild).
      #
      # Compile-only here still catches the common breakages — package
      # rename, missing import, broken type signature — while keeping PR
      # validation under a minute. ./gradlew check excluded for the same
      # reason: it pulls in tests as a transitive dep.
      - name: Compile main + test sources
        run: ./gradlew :jpdfium:compileJava :jpdfium:compileTestJava :jpdfium:processResources --no-daemon --stacktrace

  # Validate NativeLoader picks linux-musl-* on a real musl system. Runs the
  # loader on a JDK inside Alpine (no jextract/native needed — detectPlatform is
  # pure logic), so PRs catch musl-detection regressions even though the musl
  # PDFium native itself is built/proven separately in prebuild-pdfium.yml.
  musl-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: detectPlatform() must return linux-musl-* on Alpine
        run: |
          docker run --rm -i -v "$PWD":/src -w /src eclipse-temurin:25-jdk-alpine sh -s <<'INNER'
          set -e
          mkdir -p /tmp/m
          javac -d /tmp/m \
            jpdfium/src/main/java/stirling/software/jpdfium/panama/NativeLoader.java \
            jpdfium/src/main/java/stirling/software/jpdfium/panama/Architecture.java \
            jpdfium/src/main/java/stirling/software/jpdfium/exception/*.java
          OUT=$(echo 'System.out.println(stirling.software.jpdfium.panama.NativeLoader.detectPlatform());' \
            | jshell -q --class-path /tmp/m -)
          echo "detectPlatform() on Alpine => $OUT"
          echo "$OUT" | grep -q 'linux-musl-' || { echo "FAIL: expected linux-musl-*, got: $OUT"; exit 1; }
          echo "OK: musl detection works"
          INNER

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: publishToMavenLocal
        run: ./gradlew publishToMavenLocal -Pjpdfium.version=0.0.0-ci --no-daemon --stacktrace

      - name: Inspect artifacts
        run: |
          find ~/.m2/repository/com/stirling -type f \
            \( -name '*.jar' -o -name '*.pom' \) | sort
          # Every published artifact must have sources + javadoc alongside it.
          missing=0
          for pom in $(find ~/.m2/repository/com/stirling -name '*.pom'); do
            base=${pom%.pom}
            art=$(basename "$base")
            case "$art" in
              *-bom-*) continue ;;  # BOMs have no jars
            esac
            for suffix in '.jar' '-sources.jar' '-javadoc.jar'; do
              if [ ! -f "${base}${suffix}" ]; then
                echo "MISSING: ${base}${suffix}"
                missing=1
              fi
            done
          done
          exit $missing
