name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Shared jextract installation step (used across multiple jobs)
# ---------------------------------------------------------------------------
# Each job that needs jextract copies the relevant platform block below.
# There is intentionally no composite action to keep the YAML transparent.

jobs:

  # -------------------------------------------------------------------------
  # Job 1: Cross-platform compilation check
  # -------------------------------------------------------------------------
  build:
    name: Build & Verify (Compilation)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Validate Gradle Wrapper checksum
        uses: gradle/actions/wrapper-validation@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0

      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install build deps (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y cmake --version=4.4.2
          choco install -y ninja --version=1.13.2

      - name: Install jextract (Linux)
        if: runner.os == 'Linux'
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Install jextract (macOS)
        if: runner.os == 'macOS'
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_macos-aarch64_bin.tar.gz"
          else
            JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_macos-x64_bin.tar.gz"
          fi
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Install jextract (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_windows-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge (no PDFium required)
        run: bash native/build-stub.sh

      - name: Compile main and test sources
        run: ./gradlew :jpdfium:compileJava :jpdfium:compileTestJava :jpdfium:processResources --no-daemon --stacktrace

  # -------------------------------------------------------------------------
  # Job 1b: Validate musl native detection on a real Alpine/musl JVM
  # -------------------------------------------------------------------------
  # Runs NativeLoader.detectPlatform() on a JDK inside Alpine (no jextract or
  # native PDFium needed - detectPlatform is pure logic), so PRs catch
  # musl-detection regressions even though the musl PDFium native itself is
  # built/proven separately in prebuild-pdfium.yml / snapshot.yml.
  musl-detection:
    name: Musl Native Detection (Alpine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: detectPlatform() must return linux-musl-* on Alpine
        run: |
          docker run --rm -i -v "$PWD":/src -w /src eclipse-temurin:25-jdk-alpine sh -s <<'INNER'
          set -e
          mkdir -p /tmp/m
          javac -d /tmp/m \
            jpdfium/src/main/java/stirling/software/jpdfium/panama/NativeLoader.java \
            jpdfium/src/main/java/stirling/software/jpdfium/panama/Architecture.java \
            jpdfium/src/main/java/stirling/software/jpdfium/exception/*.java
          OUT=$(echo 'System.out.println(stirling.software.jpdfium.panama.NativeLoader.detectPlatform());' \
            | jshell -q --class-path /tmp/m -)
          echo "detectPlatform() on Alpine => $OUT"
          echo "$OUT" | grep -q 'linux-musl-' || { echo "FAIL: expected linux-musl-*, got: $OUT"; exit 1; }
          echo "OK: musl detection works"
          INNER

  # -------------------------------------------------------------------------
  # Job 2: Full unit & integration test suite (Linux x64)
  # -------------------------------------------------------------------------
  unit-e2e-tests:
    name: Unit & Integration E2E Tests (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge
        run: bash native/build-stub.sh

      - name: Run Unit Tests
        run: ./gradlew :jpdfium:test --no-daemon --stacktrace

  # -------------------------------------------------------------------------
  # Job 3: Robustness, leak detection, and determinism tests
  # -------------------------------------------------------------------------
  robustness-tests:
    name: Robustness, Leak & Determinism Tests (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge
        run: bash native/build-stub.sh

      - name: Robustness corpus (malformed PDF inputs)
        run: |
          ./gradlew :jpdfium:test \
            --tests "stirling.software.jpdfium.RobustnessTest" \
            --no-daemon --stacktrace

      - name: Native memory leak detection (RSS-bounded, Linux)
        run: |
          ./gradlew :jpdfium:test \
            --tests "stirling.software.jpdfium.NativeMemoryLeakTest" \
            --no-daemon --stacktrace

      - name: Render determinism check (byte-identical output)
        run: |
          ./gradlew :jpdfium:test \
            --tests "stirling.software.jpdfium.DeterminismTest" \
            --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: robustness-test-reports
          path: jpdfium/build/reports/tests/test/

  # -------------------------------------------------------------------------
  # Job 4: Concurrency stress tests
  # -------------------------------------------------------------------------
  concurrency-stress:
    name: Concurrency Stress Tests (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge
        run: bash native/build-stub.sh

      - name: Run concurrency + thread-safety tests
        run: |
          ./gradlew :jpdfium:test \
            --tests "stirling.software.jpdfium.ConcurrencyTest" \
            --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: concurrency-test-reports
          path: jpdfium/build/reports/tests/test/

  # -------------------------------------------------------------------------
  # Job 5: JMH microbenchmarks (FFM downcall overhead gate)
  # -------------------------------------------------------------------------
  jmh-benchmarks:
    name: JMH Benchmarks (FFM Downcall Overhead Gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge
        run: bash native/build-stub.sh

      - name: Run JMH benchmarks
        run: |
          ./gradlew :jpdfium:jmh \
            -Pjmh.warmupIterations=4 \
            -Pjmh.iterations=5 \
            --no-daemon

      - name: Restore main-branch baseline from cache
        id: cache-baseline
        uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: jpdfium/build/results/jmh/baseline.json
          key: jmh-baseline-${{ github.base_ref || 'main' }}
          restore-keys: jmh-baseline-

      - name: Compare results against baseline (warn if regressed >15%)
        run: |
          RESULTS="jpdfium/build/results/jmh/results.json"
          BASELINE="jpdfium/build/results/jmh/baseline.json"
          if [ ! -f "$BASELINE" ]; then
            echo "No baseline found -- this is either the first run or the cache expired."
            echo "Storing current results as the new baseline."
            cp "$RESULTS" "$BASELINE"
            exit 0
          fi
          if python3 .github/scripts/compare-jmh.py; then
            exit 0
          fi
          echo ""
          echo "Regressions detected - re-running benchmarks once to rule out"
          echo "transient runner noise before failing the job..."
          ./gradlew :jpdfium:jmh \
            -Pjmh.warmupIterations=4 \
            -Pjmh.iterations=5 \
            --no-daemon
          python3 .github/scripts/compare-jmh.py

      - name: Update baseline cache on main push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: jpdfium/build/results/jmh/baseline.json
          key: jmh-baseline-main

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jmh-results-${{ github.run_id }}
          path: jpdfium/build/results/jmh/results.json

  # -------------------------------------------------------------------------
  # Job 6: Samples E2E suite (all 88 feature samples)
  # -------------------------------------------------------------------------
  samples-e2e-suite:
    name: Samples E2E Suite (All 88 Feature Samples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge
        run: bash native/build-stub.sh

      - name: Run All 88 JPDFium Samples
        run: ./gradlew runAllSamples --no-daemon --stacktrace

  # -------------------------------------------------------------------------
  # Job 7: Maven publish dry-run
  # -------------------------------------------------------------------------
  publish-dry-run:
    name: Publish Maven Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: publishToMavenLocal
        run: ./gradlew publishToMavenLocal -Pjpdfium.version=0.0.0-ci --no-daemon --stacktrace

      - name: Inspect artifacts
        run: |
          find ~/.m2/repository/com/stirling -type f \
            \( -name '*.jar' -o -name '*.pom' \) | sort
          missing=0
          for pom in $(find ~/.m2/repository/com/stirling -name '*.pom'); do
            base=${pom%.pom}
            art=$(basename "$base")
            case "$art" in
              *-bom-*) continue ;;
            esac
            for suffix in '.jar' '-sources.jar' '-javadoc.jar'; do
              if [ ! -f "${base}${suffix}" ]; then
                echo "MISSING: ${base}${suffix}"
                missing=1
              fi
            done
          done
          exit $missing

  # -------------------------------------------------------------------------
  # Job 8: GraalVM Native Image smoke + E2E test (Linux x64)
  # -------------------------------------------------------------------------
  graalvm-native-smoke:
    name: GraalVM Native Image Smoke & E2E Test (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1.6.4
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - uses: gradle/actions/setup-gradle@889dc537cf3672c0c060560c9ead940a2b8b7077 # v6.3.0

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge
        run: bash native/build-stub.sh

      - name: Run GraalVM Native Image Smoke Test
        run: ./gradlew :jpdfium-natives:jpdfium-natives-linux-x64:processResources :jpdfium:graalvmNativeSmokeTest -Pjpdfium.testNatives=linux-x64 --no-daemon --stacktrace
