name: CI

on:
  pull_request: {}
  push:
    branches: [main]
  # The post-release version bump dispatches this workflow on its branch, because
  # a branch pushed and a pull request opened with GITHUB_TOKEN schedule no run.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Shared jextract installation step (used across multiple jobs)
# ---------------------------------------------------------------------------
# Each job that needs jextract copies the relevant platform block below.
# There is intentionally no composite action to keep the YAML transparent.

jobs:

  # -------------------------------------------------------------------------
  # Job 1: Cross-platform compilation check
  # -------------------------------------------------------------------------
  build:
    name: Build & Verify (Compilation)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Validate Gradle Wrapper checksum
        uses: gradle/actions/wrapper-validation@1cff18a4cfab5cd8d4c49a8ccf11c1ad18bb30b9 # v6.3.0

      - uses: actions/setup-java@816722acf8fd27c9d1e9ae6ee6085da07e0d44c1 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@1cff18a4cfab5cd8d4c49a8ccf11c1ad18bb30b9 # v6.3.0

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libicu-dev icu-devtools

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: brew install cmake ninja

      - name: Install build deps (Windows)
        if: runner.os == 'Windows'
        run: |
          # Preinstalled cmake/ninja used; Chocolatey is a retried fallback.
          bash native/ci/windows-build-deps.sh cmake ninja

      - name: Install jextract (Linux)
        if: runner.os == 'Linux'
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Install jextract (macOS)
        if: runner.os == 'macOS'
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_macos-aarch64_bin.tar.gz"
          else
            JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_macos-x64_bin.tar.gz"
          fi
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Install jextract (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_windows-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge (no PDFium required)
        run: bash native/build-stub.sh

      - name: Compile main and test sources
        run: ./gradlew :jpdfium:compileJava :jpdfium:compileTestJava :jpdfium:processResources :jpdfium-vips:compileJava :jpdfium-vips:compileTestJava :jpdfium-vips:processResources --no-daemon --stacktrace

      - name: Full JDK with jmods for ProGuard
        if: runner.os == 'Linux'
        # Temurin 25 is a jmod-less runtime under JEP 493. ProGuard still needs
        # Java library class files, so use GraalVM's full JDK for this
        # measurement only; the production build stays on Temurin.
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: ProGuard jar size experiment (non-publishing)
        if: runner.os == 'Linux'
        # Production jars remain unmodified: ProGuard's safe shrink-only mode
        # saves only a few percent and its optimized/obfuscated modes alter
        # public signatures or reflection/native-image metadata. Keep the
        # experiment visible in CI instead of letting the trade-off drift.
        run: bash native/proguard-jars.sh

  # -------------------------------------------------------------------------
  # Job 1b: Validate musl native detection on a real Alpine/musl JVM
  # -------------------------------------------------------------------------
  # Runs NativeLoader.detectPlatform() on a JDK inside Alpine (no jextract or
  # native PDFium needed - detectPlatform is pure logic), so PRs catch
  # musl-detection regressions even though the musl PDFium native itself is
  # built/proven separately in prebuild-pdfium.yml / snapshot.yml.
  musl-detection:
    name: Musl Native Detection (Alpine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: detectPlatform() must return linux-musl-* on Alpine
        run: |
          # Anonymous Docker Hub pulls are rate limited ("toomanyrequests"),
          # which used to fail this job in seconds during busy windows. Prefer
          # the AWS ECR Public mirror of the official image, fall back to Docker
          # Hub, and retry each with backoff before giving up.
          IMAGES=(
            public.ecr.aws/docker/library/eclipse-temurin:25-jdk-alpine
            eclipse-temurin:25-jdk-alpine
          )
          IMG=""
          for img in "${IMAGES[@]}"; do
            for attempt in 1 2 3 4 5; do
              if docker pull "$img" >/dev/null 2>&1; then IMG="$img"; break 2; fi
              # Back off only while another attempt remains, so the fallback
              # image (or the failure) is not delayed by a final pointless sleep.
              if [ "$attempt" -lt 5 ]; then
                echo "docker pull $img failed (attempt $attempt); backing off"
                sleep $((attempt * 15))
              fi
            done
          done
          if [ -z "$IMG" ]; then
            echo "FAIL: could not pull an Alpine JDK image from any registry"; exit 1
          fi
          echo "Using Alpine JDK image: $IMG"
          cp buildSrc/libs/xz-1.10.jar /tmp/xz.jar
          docker run --rm -i -v "$PWD":/src -v /tmp/xz.jar:/tmp/xz.jar:ro -w /src "$IMG" sh -s <<'INNER'
          set -e
          mkdir -p /tmp/m
          # Compile the whole main source tree: NativeLoader calls
          # JpdfiumLib.checkAbiCompatible(), so a hand-picked file list breaks
          # the moment the loader gains another intra-module reference.
          javac -cp /tmp/xz.jar --module-path /tmp/xz.jar -d /tmp/m \
            $(find jpdfium/src/main/java -name '*.java')
          OUT=$(echo 'System.out.println(stirling.software.jpdfium.panama.NativeLoader.detectPlatform());' \
            | jshell -q --class-path /tmp/m:/tmp/xz.jar -)
          echo "detectPlatform() on Alpine => $OUT"
          echo "$OUT" | grep -q 'linux-musl-' || { echo "FAIL: expected linux-musl-*, got: $OUT"; exit 1; }
          echo "OK: musl detection works"
          INNER

  # -------------------------------------------------------------------------
  # Job 2: Full unit & integration test suite (Linux x64)
  # -------------------------------------------------------------------------
  unit-e2e-tests:
    name: Unit & Integration E2E Tests (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@816722acf8fd27c9d1e9ae6ee6085da07e0d44c1 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@1cff18a4cfab5cd8d4c49a8ccf11c1ad18bb30b9 # v6.3.0

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge
        run: bash native/build-stub.sh

      - name: Run Unit Tests
        run: ./gradlew :jpdfium:test --no-daemon --stacktrace

  # -------------------------------------------------------------------------
  # Job 2b: Natural upstream libvips and Stirling-PDF downstream integration
  # -------------------------------------------------------------------------
  vips-system-integration:
    name: Natural System Libvips & Downstream Integration (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@816722acf8fd27c9d1e9ae6ee6085da07e0d44c1 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@1cff18a4cfab5cd8d4c49a8ccf11c1ad18bb30b9 # v6.3.0

      - name: Install system libvips and codec dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libvips-dev libvips42 libheif-dev libwebp-dev

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge
        run: bash native/build-stub.sh

      - name: Run libvips tests and Stirling-PDF integration suite
        run: ./gradlew :jpdfium-vips:test --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vips-system-integration-reports
          path: jpdfium-vips/build/reports/tests/test/

  # -------------------------------------------------------------------------
  # Job 3: Robustness, leak detection, and determinism tests
  # -------------------------------------------------------------------------
  robustness-tests:
    name: Robustness, Leak & Determinism Tests (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@816722acf8fd27c9d1e9ae6ee6085da07e0d44c1 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@1cff18a4cfab5cd8d4c49a8ccf11c1ad18bb30b9 # v6.3.0

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge
        run: bash native/build-stub.sh

      - name: Robustness corpus (malformed PDF inputs)
        run: |
          ./gradlew :jpdfium:test \
            --tests "stirling.software.jpdfium.RobustnessTest" \
            --no-daemon --stacktrace

      - name: Native memory leak detection (RSS-bounded, Linux)
        run: |
          ./gradlew :jpdfium:test \
            --tests "stirling.software.jpdfium.NativeMemoryLeakTest" \
            --no-daemon --stacktrace

      - name: Render determinism check (byte-identical output)
        run: |
          ./gradlew :jpdfium:test \
            --tests "stirling.software.jpdfium.DeterminismTest" \
            --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robustness-test-reports
          path: jpdfium/build/reports/tests/test/

  # -------------------------------------------------------------------------
  # Job 4: Concurrency stress tests
  # -------------------------------------------------------------------------
  concurrency-stress:
    name: Concurrency Stress Tests (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@816722acf8fd27c9d1e9ae6ee6085da07e0d44c1 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@1cff18a4cfab5cd8d4c49a8ccf11c1ad18bb30b9 # v6.3.0

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge
        run: bash native/build-stub.sh

      - name: Run concurrency + thread-safety tests
        run: |
          ./gradlew :jpdfium:test \
            --tests "stirling.software.jpdfium.ConcurrencyTest" \
            --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: concurrency-test-reports
          path: jpdfium/build/reports/tests/test/

  # -------------------------------------------------------------------------
  # Job 5: JMH microbenchmarks (advisory trend report, not a gate)
  #
  # Shared runners cannot reproduce absolute scores closely enough to gate a
  # PR: the same commit can measure 20-40% apart across `ubuntu-latest`
  # instances. This job still fails if JMH itself cannot run, but a baseline
  # regression is reported without failing the build.
  # -------------------------------------------------------------------------
  jmh-benchmarks:
    name: JMH Benchmarks (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@816722acf8fd27c9d1e9ae6ee6085da07e0d44c1 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@1cff18a4cfab5cd8d4c49a8ccf11c1ad18bb30b9 # v6.3.0

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge
        run: bash native/build-stub.sh

      - name: Run JMH benchmarks
        run: |
          ./gradlew :jpdfium:jmh \
            -Pjmh.warmupIterations=4 \
            -Pjmh.iterations=5 \
            --no-daemon

      - name: Restore main-branch baseline from cache
        id: cache-baseline
        uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: jpdfium/build/results/jmh/baseline.json
          # Unique save key per run; restore-keys resolves the newest baseline.
          key: jmh-baseline-v3-${{ github.base_ref || 'main' }}-${{ github.run_id }}
          restore-keys: jmh-baseline-v3-${{ github.base_ref || 'main' }}-

      - name: Compare results against baseline (advisory only)
        # Advisory, never blocking. Absolute JMH scores from two different
        # `ubuntu-latest` runner instances routinely differ by 20-40% on the
        # same commit, so a cached cross-run baseline cannot support a
        # regression gate. The comparison stays for trend visibility, but its
        # exit code must not decide whether the job passes.
        run: |
          RESULTS="jpdfium/build/results/jmh/results.json"
          BASELINE="jpdfium/build/results/jmh/baseline.json"
          if [ ! -f "$BASELINE" ]; then
            echo "No baseline found -- this is either the first run or the cache expired."
            echo "Storing current results as the new baseline."
            cp "$RESULTS" "$BASELINE"
            exit 0
          fi
          python3 .github/scripts/compare-jmh.py --advisory

      - name: Update baseline cache on main push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: jpdfium/build/results/jmh/baseline.json
          # Run-scoped key, so a fixed key can no longer freeze the baseline.
          key: jmh-baseline-v3-${{ github.base_ref || 'main' }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jmh-results-${{ github.run_id }}
          path: jpdfium/build/results/jmh/results.json

  # -------------------------------------------------------------------------
  # Job 6: Samples E2E suite (all 88 feature samples)
  # -------------------------------------------------------------------------
  samples-e2e-suite:
    name: Samples E2E Suite (All 88 Feature Samples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@816722acf8fd27c9d1e9ae6ee6085da07e0d44c1 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@1cff18a4cfab5cd8d4c49a8ccf11c1ad18bb30b9 # v6.3.0

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge
        run: bash native/build-stub.sh

      - name: Run All 88 JPDFium Samples
        run: ./gradlew runAllSamples --no-daemon --stacktrace

  # -------------------------------------------------------------------------
  # Job 7: Maven publish dry-run
  # -------------------------------------------------------------------------
  publish-dry-run:
    name: Publish Maven Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@816722acf8fd27c9d1e9ae6ee6085da07e0d44c1 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@1cff18a4cfab5cd8d4c49a8ccf11c1ad18bb30b9 # v6.3.0

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: publishToMavenLocal
        run: ./gradlew publishToMavenLocal -Pjpdfium.version=0.0.0-ci --no-daemon --stacktrace

      - name: Inspect artifacts
        run: |
          find ~/.m2/repository/com/stirling -type f \
            \( -name '*.jar' -o -name '*.pom' \) | sort
          missing=0
          for pom in $(find ~/.m2/repository/com/stirling -name '*.pom'); do
            base=${pom%.pom}
            art=$(basename "$base")
            case "$art" in
              *-bom-*) continue ;;
            esac
            for suffix in '.jar' '-sources.jar' '-javadoc.jar'; do
              if [ ! -f "${base}${suffix}" ]; then
                echo "MISSING: ${base}${suffix}"
                missing=1
              fi
            done
          done
          # Consumers must choose their platform. The core artifact must never
          # publish a jpdfium-natives-* dependency (that used to force Linux
          # x64 onto every macOS/Windows/ARM user).
          meta_count=0
          for meta in $(find ~/.m2/repository/com/stirling/jpdfium -maxdepth 2 \
              \( -name 'jpdfium-*.pom' -o -name 'jpdfium-*.module' \)); do
            meta_count=$((meta_count + 1))
            if grep -q 'jpdfium-natives' "$meta"; then
              echo "ERROR: published metadata contains a native dependency: $meta"
              grep -n 'jpdfium-natives' "$meta" || true
              missing=1
            fi
          done
          if [ "$meta_count" -eq 0 ]; then
            echo "ERROR: no jpdfium POM/module metadata found to inspect"
            missing=1
          fi
          exit $missing

  # -------------------------------------------------------------------------
  # Job 8: GraalVM Native Image smoke + E2E test (Linux x64)
  # -------------------------------------------------------------------------
  graalvm-native-smoke:
    name: GraalVM Native Image Smoke & E2E Test (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - uses: gradle/actions/setup-gradle@1cff18a4cfab5cd8d4c49a8ccf11c1ad18bb30b9 # v6.3.0

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Build stub bridge
        run: bash native/build-stub.sh

      - name: Run GraalVM Native Image Smoke Test
        run: ./gradlew :jpdfium-natives:jpdfium-natives-linux-x64:processResources :jpdfium:graalvmNativeSmokeTest -Pjpdfium.testNatives=linux-x64 --no-daemon --stacktrace

  # -------------------------------------------------------------------------
  # Job 9: README quick start example (published artifacts)
  # -------------------------------------------------------------------------
  readme-example:
    name: README Quick Start Example (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@816722acf8fd27c9d1e9ae6ee6085da07e0d44c1 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@1cff18a4cfab5cd8d4c49a8ccf11c1ad18bb30b9 # v6.3.0

      - name: Run the README example against the published artifacts
        run: ./gradlew -p examples/render-first-page run --args="sample.pdf page-1.png" --no-daemon

      - name: Verify the rendered page
        run: |
          test -s examples/render-first-page/page-1.png
          test "$(file --brief --mime-type examples/render-first-page/page-1.png)" = "image/png"
