name: Security

on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['java-kotlin', 'c-cpp']
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Install jextract
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Install C++ analysis deps (Linux)
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libpcre2-dev libfreetype6-dev libharfbuzz-dev libicu-dev \
            libqpdf-dev libpugixml-dev libunibreak-dev

      - uses: github/codeql-action/init@7d9249f5a57288b8a472ddd9cc3ece1921f7dc38 # codeql-bundle-v2.26.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: manual

      - name: Build (Java)
        if: matrix.language == 'java-kotlin'
        run: |
          bash native/build-stub.sh
          ./gradlew :jpdfium:compileJava --no-daemon

      - name: Build (C++)
        if: matrix.language == 'c-cpp'
        run: bash native/build-stub.sh

      - uses: github/codeql-action/analyze@7d9249f5a57288b8a472ddd9cc3ece1921f7dc38 # codeql-bundle-v2.26.2
        with:
          category: "/language:${{ matrix.language }}"

  osv-scanner:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: google/osv-scanner-action/osv-scanner-action@f4cfcc01edc9c8b756a9b873b7a623ca674da51e # v2.5.0
        with:
          scan-args: --recursive ./

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@e8e61e86ea0a152be84d03729c02a7300065c17d # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@7d9249f5a57288b8a472ddd9cc3ece1921f7dc38 # codeql-bundle-v2.26.2
        with:
          sarif_file: results.sarif
