name: Release to Central Portal

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0). If omitted on tag push, derived from the tag.'
        required: false
      autoRelease:
        description: 'Auto-release to Maven Central without manual Publish click'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Prep: cross-build trimmed ICU 78 data once on Linux ──────────────────
  # Used by windows-x64 (downloads icudt78.dll) and both darwin-* jobs
  # (download the bare icudt78l.dat + wrap on macOS via clang). brew icu4c@78
  # on macOS doesn't ship icupkg/pkgdata so we can't trim there; vcpkg's icu
  # port skips the tools dir on Windows; Linux's apt icu-devtools has both,
  # and the .dat archive format is OS-agnostic. Mirrors snapshot.yml's
  # prep-windows-icu but covers macOS too.
  prep-icu-data:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Install build deps (Linux + mingw-w64)
        run: |
          sudo sed -i \
            -e 's|http://ports\.ubuntu\.com|http://azure.ports.ubuntu.com|g' \
            -e 's|http://archive\.ubuntu\.com|http://azure.archive.ubuntu.com|g' \
            -e 's|http://security\.ubuntu\.com|http://azure.archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y \
              build-essential icu-devtools libicu-dev \
              mingw-w64 binutils-mingw-w64 \
              curl unzip && exit 0
            sleep 30
          done
          exit 1
      - name: Cross-build minimal Windows icudt78.dll + bare trimmed .dat
        run: bash native/build-minimal-icu-windows.sh
      - name: Upload trimmed Windows icudt78.dll
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-icu-trimmed
          path: native/dist/windows-x64/icudt78.dll
          if-no-files-found: warn  # script bails out -> windows job uses vcpkg's full 33 MB dll
          retention-days: 1
      - name: Upload bare trimmed ICU .dat (for macOS wrap step)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icu-data-trimmed
          path: native/dist/icu-data/icudt*l.dat
          if-no-files-found: warn  # macOS jobs fall back to brew's 33 MB libicudata
          retention-days: 1

  # ── Fan out: build native libraries on each platform ──────────────────────
  build-natives:
    needs: prep-icu-data
    if: always()  # build even if prep failed; matrix jobs fall back to untrimmed ICU
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            shell: bash
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            shell: bash
          # musl / Alpine (linux-musl-*). Built inside a matching-arch Alpine
          # container (eclipse-temurin:25-jdk-alpine = musl JDK) via docker run
          # from the host - GitHub cannot run JS actions in Alpine containers on
          # arm64 runners, so there is no job-level container here. Consumes the
          # musl PDFium prebuilds from prebuild-pdfium.yml.
          - platform: linux-musl-x64
            runner: ubuntu-latest
            shell: bash
            libc: musl
          - platform: linux-musl-arm64
            runner: ubuntu-24.04-arm
            shell: bash
            libc: musl
          # darwin-x64 cross-compiles from macos-14 (arm64) under Rosetta
          # with a second Homebrew installed at /usr/local for x86_64 deps.
          - platform: darwin-x64
            runner: macos-14
            shell: bash
          - platform: darwin-arm64
            runner: macos-14
            shell: bash
          - platform: windows-x64
            runner: windows-latest
            shell: 'bash'  # git-bash provided by actions/checkout
          - platform: windows-arm64
            runner: windows-11-arm
            shell: 'bash'  # git-bash provided by actions/checkout
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@273229181560643261a71a1544c22304f2a40df8 # v5.7.0
        # The musl legs build + smoke inside an Alpine container which ships its
        # own musl JDK - a glibc host JDK is neither needed nor usable there.
        if: matrix.libc != 'musl'
        with:
          # Temurin does not publish JDK 25 for Windows aarch64; Microsoft
          # Build of OpenJDK does, so use it on the windows-arm64 leg.
          distribution: ${{ matrix.platform == 'windows-arm64' && 'microsoft' || 'temurin' }}
          java-version: '25'

      - name: Install build deps (Linux)
        if: startsWith(matrix.platform, 'linux-') && matrix.libc != 'musl'
        # Azure apt mirror + 3x retry + mingw-w64 (for Windows ICU cross-build)
        # + meson (for harfbuzz-no-glib rebuild).
        run: |
          sudo sed -i \
            -e 's|http://ports\.ubuntu\.com|http://azure.ports.ubuntu.com|g' \
            -e 's|http://archive\.ubuntu\.com|http://azure.archive.ubuntu.com|g' \
            -e 's|http://security\.ubuntu\.com|http://azure.archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y \
              build-essential cmake ninja-build pkg-config meson \
              libpcre2-dev libfreetype6-dev libharfbuzz-dev libicu-dev icu-devtools \
              libqpdf-dev libpugixml-dev libunibreak-dev \
              mingw-w64 binutils-mingw-w64 \
              lld \
              patchelf && exit 0
            echo "apt install attempt $attempt failed; retrying in 30s..." >&2
            sleep 30
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1

      - name: Install build deps (macOS, native arm64)
        if: matrix.platform == 'darwin-arm64'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          brew install cmake ninja \
            pcre2 freetype harfbuzz icu4c qpdf pugixml libunibreak \
            pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install build deps (macOS, x86_64 cross-compile)
        if: matrix.platform == 'darwin-x64'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
          if [ ! -x /usr/local/bin/brew ]; then
            arch -x86_64 /bin/bash -c \
              'NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL --max-time 120 https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
          fi
          arch -x86_64 /usr/local/bin/brew install \
            pcre2 freetype harfbuzz icu4c pugixml libunibreak pkg-config
          # If x86_64 bottle is unavailable for qpdf on macOS, install from source or build with fallback
          arch -x86_64 /usr/local/bin/brew install qpdf || arch -x86_64 /usr/local/bin/brew install --build-from-source qpdf
          {
            echo "PKG_CONFIG_PATH=/usr/local/opt/icu4c/lib/pkgconfig:/usr/local/lib/pkgconfig"
            echo "PKG_CONFIG=/usr/local/bin/pkg-config"
            echo "CMAKE_OSX_ARCHITECTURES=x86_64"
          } >> "$GITHUB_ENV"

      - name: Cache vcpkg binary packages
        if: startsWith(matrix.platform, 'windows-')
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-binary-${{ matrix.platform }}-${{ hashFiles('native/vcpkg-overlay/**', '.github/workflows/release.yml') }}
          restore-keys: vcpkg-binary-${{ matrix.platform }}-

      - name: Install build deps (Windows)
        if: startsWith(matrix.platform, 'windows-')
        run: |
          choco install -y cmake ninja
          if command -v pkg-config >/dev/null 2>&1; then
            echo "pkg-config already on PATH"
          elif [ -f "C:/Strawberry/c/bin/pkg-config.exe" ]; then
            echo "C:/Strawberry/c/bin" >> "$GITHUB_PATH"
          else
            choco install -y pkgconf || choco install -y pkgconfiglite || true
          fi
          echo "VCPKG_BINARY_SOURCES=files,${{ runner.temp }}/vcpkg-binary-cache,readwrite" >> "$GITHUB_ENV"
          # vcpkg installs into a triplet-scoped tree. Pick the triplet that
          # matches the target arch (arm64-windows on windows-11-arm runners).
          # vcpkg-install.sh adds our freetype overlay port (GitHub mirror, the
          # stock gitlab.freedesktop.org source is chronically flaky) + retries.
          if [ "${{ matrix.platform }}" = "windows-arm64" ]; then
            TRIPLET="arm64-windows"
            PLAT_GEN="ARM64"
          else
            TRIPLET="x64-windows"
            PLAT_GEN="x64"
          fi
          bash native/vcpkg-install.sh \
            pkgconf:$TRIPLET \
            pcre2:$TRIPLET freetype:$TRIPLET harfbuzz:$TRIPLET \
            icu:$TRIPLET qpdf:$TRIPLET pugixml:$TRIPLET \
            libunibreak:$TRIPLET
          {
            echo "CMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
            echo "PKG_CONFIG_PATH=$VCPKG_INSTALLATION_ROOT/installed/$TRIPLET/lib/pkgconfig"
            echo "VCPKG_TARGET_TRIPLET=$TRIPLET"
            echo "CMAKE_GENERATOR_PLATFORM=$PLAT_GEN"
          } >> "$GITHUB_ENV"
          echo "$VCPKG_INSTALLATION_ROOT/installed/$TRIPLET/tools/pkgconf" >> "$GITHUB_PATH"

      - name: Fetch prebuilt PDFium (pinned)
        id: fetch
        # The musl PDFium prebuilds are experimental (Prebuild PDFium's release
        # sanity check treats linux-musl-* as warn-only). Until that workflow is
        # green, a missing pdfium-linux-musl-*.tar.gz must SKIP the musl legs,
        # not fail the release - the skip is surfaced by the step below.
        continue-on-error: ${{ matrix.libc == 'musl' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Release stays on component mode - verified empirically that the
          # `static` variant (pdf_is_complete_lib=true) is BIGGER, not
          # smaller, because --whole-archive linking + the FPDF_* dlsym
          # export contract means the linker can't dead-strip anything in
          # libpdfium.a (which already contains all bundled deps as their
          # own .o files). linux-x64 raw artifact: 28 MB (component) ->
          # 31 MB (static); linux-arm64: 28 MB -> 30 MB; windows-x64
          # static doesn't even link (libc++ __Cr symbol mismatch). The
          # dual-mode infrastructure is kept in place so we can iterate on
          # gc-sections / function-sections later without redoing the
          # prebuild plumbing, but the value isn't there with the obvious
          # whole-archive approach. Set JPDFIUM_BUILD_MODE=static manually
          # via workflow_dispatch if you want to experiment.
        run: bash native/fetch-prebuilt-pdfium.sh ${{ matrix.platform }}

      # musl legs run the ENTIRE native build + smoke inside an Alpine container
      # via docker run from the host (GitHub cannot host JS actions in Alpine
      # containers on arm64 runners, so no job-level `container:`). One container
      # run does bootstrap + rebuild deps + bridge + stage + bundle + smoke, so
      # the ~1 GB apk bootstrap happens once. The smoke INITS the native and
      # opens a PDF on the musl JVM - the linux-musl-* leg is red until both pass.
      - name: Build + smoke musl natives (Alpine container)
        id: musl
        if: matrix.libc == 'musl' && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Shipped jar: the musl bundle must be held to the strict size gate too.
          SIZE_GATE_STRICT: '1'
        run: bash native/ci/alpine-exec.sh ${{ matrix.platform }} natives smoke

      - name: Skip musl natives (missing musl PDFium prebuild)
        if: matrix.libc == 'musl' && steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::linux-musl-* natives skipped: pdfium-linux-musl-*.tar.gz is not in the pinned PDFium prebuild release yet."
          echo "Run the 'Prebuild PDFium' workflow to produce it; once that is green the musl natives build + smoke resumes."

      - name: Build qpdf with native crypto (Linux + macOS)
        if: matrix.libc != 'musl' && (startsWith(matrix.platform, 'linux-') || startsWith(matrix.platform, 'darwin-'))
        run: bash native/build-qpdf-native-crypto.sh

      - name: Build harfbuzz without GLib (Linux + macOS)
        if: matrix.libc != 'musl' && (startsWith(matrix.platform, 'linux-') || startsWith(matrix.platform, 'darwin-'))
        run: bash native/build-harfbuzz-no-glib.sh

      - name: Build native bridge
        if: matrix.libc != 'musl'
        run: bash native/build-real.sh

      - name: Build minimal ICU data (Linux)
        if: startsWith(matrix.platform, 'linux-') && matrix.libc != 'musl'
        # JPDFIUM_TARGET_PLATFORM makes the trimmed lib land in the right natives
        # dist dir on the musl legs (linux-musl-*) too.
        env:
          JPDFIUM_TARGET_PLATFORM: ${{ matrix.platform }}
        run: bash native/build-minimal-icu.sh

      - name: Download bare trimmed ICU .dat (macOS)
        if: startsWith(matrix.platform, 'darwin-')
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        continue-on-error: true        # missing -> macOS bundler falls back to brew's 33 MB libicudata
        with:
          name: icu-data-trimmed
          path: native/dist/icu-data/

      - name: Build minimal ICU data (macOS)
        if: startsWith(matrix.platform, 'darwin-')
        run: bash native/build-minimal-icu-macos.sh

      - name: Import macOS signing certificate
        # Signing is a publish concern. If no cert secret is configured (forks /
        # dev) allow unsigned so the leg can build + smoke; the upstream (with
        # the cert) signs + notarizes.
        if: startsWith(matrix.platform, 'darwin-')
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            echo "::warning::no macOS signing cert configured - darwin natives will be UNSIGNED (fork/dev CI)"
            echo "MACOS_ALLOW_UNSIGNED=1" >> "$GITHUB_ENV"
          else
            bash native/import-macos-cert.sh
          fi

      - name: Stage binaries for publish
        if: matrix.libc != 'musl'
        run: |
          mkdir -p native/dist/${{ matrix.platform }}
          # build-real.sh writes libjpdfium.* / jpdfium.dll into native/build-real/.
          find native/build-real -maxdepth 3 -type f \( \
                -name 'libjpdfium.*' -o -name 'jpdfium.dll' \
             \) -exec cp -v {} native/dist/${{ matrix.platform }}/ \;
          # Component-built PDFium siblings - filter out Windows debug helpers
          # picked up from MSVC install (dbghelp/msdia/symsrv/dbgcore/vccorlib).
          if [ -d native/pdfium/lib ]; then
            find native/pdfium/lib -maxdepth 1 -type f \( \
                  -name '*.dll' -o -name 'lib*.so' -o -name 'lib*.so.*' -o -name 'lib*.dylib' \
               \) \
               ! -name 'dbghelp.dll' ! -name 'dbgcore.dll' \
               ! -name 'msdia*.dll'   ! -name 'symsrv.dll' \
               ! -name 'vccorlib*.dll' \
               -exec cp -v {} native/dist/${{ matrix.platform }}/ \;
          fi

      # The trimmed icudt78.dll must replace the full 33 MB vcpkg one BEFORE
      # the bundler's size gate runs, or the windows bundle fails its budget.
      - name: Override icudt78.dll with trimmed copy (Windows only)
        if: matrix.platform == 'windows-x64'
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        continue-on-error: true        # missing artifact -> stay with vcpkg's full 33 MB icudt78.dll
        with:
          name: windows-icu-trimmed
          path: native/dist/windows-x64/

      - name: Bundle runtime deps + strip
        if: matrix.libc != 'musl'
        run: |
          # Bridge runtime deps - walk the bridge's import table per-platform
          # and copy only referenced libs, skipping system libs. Also strips
          # debug symbols. Shipped jar: SIZE_GATE_STRICT makes a missing budget
          # entry fail rather than silently disable the size gate.
          SIZE_GATE_STRICT=1 bash native/bundle-runtime-deps.sh ${{ matrix.platform }}
          echo "--- staged ---"
          ls -la native/dist/${{ matrix.platform }}/

      - name: Sanity check
        # Skipped musl legs (no musl PDFium prebuild yet) have no dist dir.
        if: matrix.libc != 'musl' || steps.musl.outcome == 'success'
        run: |
          test -n "$(ls -A native/dist/${{ matrix.platform }}/)" || {
            echo "ERROR: no native binaries staged for ${{ matrix.platform }}"
            exit 1
          }

      # ── Mandatory functional smoke gate ─────────────────────────────────────
      # Every release platform must prove BOTH (1) the native INITs (loads into
      # the JVM via the production NativeLoader path) and (2) it can OPEN a PDF
      # on its own architecture without crashing, before the leg is allowed to
      # publish. A "file exists" sanity check is not enough. Release goes RED
      # (never green) until both pass on every platform.
      - name: Install jextract (for smoke build)
        # jextract only ships glibc (linux-x64/aarch64, macos, windows-x64)
        # builds. musl + windows-arm64 + the darwin-x64 Rosetta leg use the
        # committed FFM bindings instead (generateBindings is skipped when
        # jextract is absent).
        if: matrix.platform != 'darwin-x64' && matrix.platform != 'windows-arm64' && matrix.libc != 'musl'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   if [ "$(uname -m)" = aarch64 ]; then JX=openjdk-25-jextract+2-4_linux-aarch64_bin.tar.gz; else JX=openjdk-25-jextract+2-4_linux-x64_bin.tar.gz; fi ;;
            macOS)   if [ "$(uname -m)" = arm64 ]; then JX=openjdk-25-jextract+2-4_macos-aarch64_bin.tar.gz; else JX=openjdk-25-jextract+2-4_macos-x64_bin.tar.gz; fi ;;
            Windows) JX=openjdk-25-jextract+2-4_windows-x64_bin.tar.gz ;;
          esac
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 "https://download.java.net/java/early_access/jextract/25/2/$JX" -o /tmp/jx.tar.gz
          tar -xzf /tmp/jx.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Functional smoke test (INIT + open a PDF)
        if: matrix.libc != 'musl' && matrix.platform != 'darwin-x64'
        run: ./gradlew :jpdfium:nativeSmokeTest -Pjpdfium.testNatives=${{ matrix.platform }} --no-daemon --stacktrace
        timeout-minutes: 60

      - name: Verify native smoke actually ran
        if: always() && matrix.libc != 'musl' && matrix.platform != 'darwin-x64'
        run: bash native/ci/check-smoke-ran.sh jpdfium/build/test-results/nativeSmokeTest

      # darwin-x64 is cross-compiled on this arm64 (macos-14) host; run its
      # x86_64 smoke under Rosetta with an x86_64 JDK so it gets the same
      # INIT + open-a-PDF gate as every other release platform.
      - name: Functional smoke test - darwin-x64 (Rosetta)
        if: matrix.platform == 'darwin-x64'
        shell: bash
        run: |
          curl -fL --max-time 300 --retry 5 --retry-all-errors --retry-delay 3 \
            "https://api.adoptium.net/v3/binary/latest/25/ga/mac/x64/jdk/hotspot/normal/eclipse?project=jdk" \
            -o /tmp/x64-jdk.tar.gz
          mkdir -p "$HOME/x64-jdk"
          tar -xzf /tmp/x64-jdk.tar.gz -C "$HOME/x64-jdk" --strip-components=1
          arch -x86_64 "$HOME/x64-jdk/Contents/Home/bin/java" -version
          export JAVA_HOME="$HOME/x64-jdk/Contents/Home"
          arch -x86_64 ./gradlew :jpdfium:nativeSmokeTest -Pjpdfium.testNatives=darwin-x64 --no-daemon --stacktrace
        timeout-minutes: 60

      - name: Verify darwin-x64 smoke actually ran
        if: always() && matrix.platform == 'darwin-x64'
        run: bash native/ci/check-smoke-ran.sh jpdfium/build/test-results/nativeSmokeTest

      - name: Verify musl smoke actually ran
        if: always() && matrix.libc == 'musl' && steps.fetch.outcome == 'success'
        run: bash native/ci/check-smoke-ran.sh jpdfium/build/test-results/nativeSmokeTest

      - name: Upload hs_err logs (smoke crash diagnostics)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hs_err-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            jpdfium/hs_err_pid*.log
            jpdfium-natives/**/hs_err_pid*.log
            **/hs_err_pid*.log
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # musl: only upload when the in-container build actually staged natives
        # (skipped legs - missing musl PDFium prebuild - have an empty dist dir).
        if: always() && (matrix.libc != 'musl' || steps.musl.outcome == 'success')
        with:
          name: natives-${{ matrix.platform }}
          path: native/dist/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7

  # CLI: single self-contained GraalVM native binary per platform
  # Each binary embeds the FULL staged natives jar for its platform (the bridge
  # + PDFium + all component deps + qpdf/pcre2/freetype/harfbuzz/icu/unibreak
  # + the Rust static lib) via -H:IncludeResources, and NativeLoader extracts
  # and loads them at first run. Result: one executable, everything included.
  #
  # windows-arm64 is intentionally absent: no GraalVM Native Image distribution
  # exists for Windows ARM64 (Oracle GraalVM ships Windows x64 only).
  cli-binaries:
    name: Build CLI binary (${{ matrix.platform }})
    needs: build-natives
    if: always()  # build whatever platform legs succeeded; others just fail that leg
    # CLI binaries are a release nicety, not the critical path: a failed leg
    # must never block the Central Portal publish. PR regressions are still
    # caught hard by the dedicated cli.yml workflow.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    runner: ubuntu-latest    }
          - { platform: linux-arm64,  runner: ubuntu-24.04-arm }
          - { platform: darwin-x64,   runner: macos-14         }
          - { platform: darwin-arm64, runner: macos-14         }
          - { platform: windows-x64,  runner: windows-latest   }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Install Rosetta (macOS x86_64)
        if: matrix.platform == 'darwin-x64'
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1.6.4
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@346a44564f803579f2a9d82d6570fa5c56d80eff # v6.3.0

      - name: Download staged natives for ${{ matrix.platform }}
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          name: natives-${{ matrix.platform }}
          path: native/dist/${{ matrix.platform }}/

      - name: Build CLI native image (bundles everything)
        run: |
          if [ "${{ matrix.platform }}" = "darwin-x64" ]; then
            arch -x86_64 ./gradlew :jpdfium:nativeCliCompile -Pjpdfium.testNatives=darwin-x64 --no-daemon || ./gradlew :jpdfium:nativeCliCompile -Pjpdfium.testNatives=darwin-x64 --no-daemon || true
          else
            ./gradlew :jpdfium:nativeCliCompile -Pjpdfium.testNatives=${{ matrix.platform }} --no-daemon
          fi

      - name: Package binary
        shell: bash
        run: |
          SRC="jpdfium/build/native/nativeCliCompile/jpdfium"
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then SRC="${SRC}.exe"; fi
          if [ -f "$SRC" ]; then
            mkdir -p native/dist/cli
            cp -v "$SRC" "native/dist/cli/jpdfium-${{ matrix.platform }}"
          else
            echo "WARN: CLI binary missing for ${{ matrix.platform }}: $SRC"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cli-${{ matrix.platform }}
          path: native/dist/cli/jpdfium-${{ matrix.platform }}
          if-no-files-found: ignore
          retention-days: 7

  # ── Fan out: build and bundle libvips natives on each platform ─────────────
  build-vips-natives:
    name: Build vips natives (${{ matrix.platform }})
    needs: build-natives
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    runner: ubuntu-latest    }
          - { platform: linux-arm64,  runner: ubuntu-24.04-arm }
          - { platform: darwin-x64,   runner: macos-14         }
          - { platform: darwin-arm64, runner: macos-14         }
          - { platform: windows-x64,  runner: windows-latest   }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-java@273229181560643261a71a1544c22304f2a40df8 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@346a44564f803579f2a9d82d6570fa5c56d80eff # v6.3.0

      - name: Download core natives for ${{ matrix.platform }}
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          name: natives-${{ matrix.platform }}
          path: native/dist/${{ matrix.platform }}/

      - name: Build full-codec libvips (Linux + macOS)
        if: startsWith(matrix.platform, 'linux-') || startsWith(matrix.platform, 'darwin-')
        run: bash native/build-vips-full-codecs.sh

      - name: Install libvips (Linux, fallback)
        if: startsWith(matrix.platform, 'linux-')
        run: |
          [ -f /usr/local/lib/libvips.so.42 ] || \
            sudo apt-get install -y --no-install-recommends libvips-dev patchelf

      - name: Install libvips (macOS, fallback)
        if: startsWith(matrix.platform, 'darwin-')
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          if [ ! -f /usr/local/lib/libvips.42.dylib ] && [ ! -f /opt/homebrew/lib/libvips.42.dylib ]; then
            brew install vips || brew link --overwrite vips
          fi

      - name: Fetch prebuilt libvips (Windows)
        if: matrix.platform == 'windows-x64'
        run: |
          set -e
          url=$(curl -fsSL https://api.github.com/repos/libvips/build-win64-mxe/releases/latest \
                | grep -oE 'https://[^"]*vips-dev-w64-all-[0-9.]+\.zip|https://[^"]*vips-dev-w64-webp-[0-9.]+\.zip' | head -n1 || true)
          [ -z "$url" ] && { echo "No prebuilt libvips Windows zip found - skipping"; exit 0; }
          curl -fsSL "$url" -o /tmp/vips.zip
          mkdir -p /tmp/vips-win && unzip -q /tmp/vips.zip -d /tmp/vips-win
          VIPS_DIR=$(find /tmp/vips-win -maxdepth 2 -name "bin" -type d | head -n1)
          if [ -n "$VIPS_DIR" ]; then
            echo "VIPS_WIN_DIST=$(dirname "$VIPS_DIR")" >> "$GITHUB_ENV"
          else
            echo "VIPS_WIN_DIST=/tmp/vips-win" >> "$GITHUB_ENV"
          fi

      - name: Import macOS signing certificate
        if: startsWith(matrix.platform, 'darwin-')
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            echo "::warning::no macOS signing cert configured - darwin vips natives will be ad-hoc signed"
            echo "MACOS_ALLOW_UNSIGNED=1" >> "$GITHUB_ENV"
          else
            bash native/import-macos-cert.sh
          fi

      - name: Stage libvips + codec chain
        run: bash native/build-vips.sh ${{ matrix.platform }}

      - name: Build vips natives jar
        run: ./gradlew :jpdfium-natives:jpdfium-natives-vips-${{ matrix.platform }}:jar --no-daemon

      - name: Vips smoke test (render PDF -> all major formats)
        run: ./gradlew :jpdfium-vips:vipsSmokeTest -Pjpdfium.testNatives=${{ matrix.platform }} -Pjpdfium.testVipsNatives=vips-${{ matrix.platform }} --no-daemon --stacktrace
        timeout-minutes: 60

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: natives-vips-${{ matrix.platform }}
          path: native/dist/vips-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7


  # ── Fan in: assemble, sign, publish everything from one runner ────────────
  publish:
    needs: [build-natives, build-vips-natives, cli-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-java@273229181560643261a71a1544c22304f2a40df8 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@346a44564f803579f2a9d82d6570fa5c56d80eff # v6.3.0

      - name: Install jextract
        # jpdfium/build.gradle.kts uses jextract to generate JpdfiumH.java
        # FFM bindings from native/bridge/include/jpdfium.h. Without it the
        # publish job fails on compileJava with `cannot find symbol JpdfiumH`
        # - the natives jars (built earlier in this run) ship fine but the
        # main jpdfium.jar can't be built without bindings. Mirrors the
        # snapshot.yml + publish-github-packages.yml jextract install step.
        run: |
          JEXTRACT_URL="https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
          mkdir -p "$HOME/jextract-install"
          curl -fsSL --max-time 120 "$JEXTRACT_URL" -o /tmp/jextract.tar.gz
          tar -xzf /tmp/jextract.tar.gz -C "$HOME/jextract-install" --strip-components=1
          echo "JEXTRACT_HOME=$HOME/jextract-install" >> "$GITHUB_ENV"

      - name: Download all native artifacts
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          path: .artifacts
          pattern: natives-*

      - name: Download all CLI binaries
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        continue-on-error: true  # CLI legs can fail independently; natives still publish
        with:
          path: .artifacts
          pattern: cli-*

      - name: Flatten into native/dist/<platform>/
        run: |
          mkdir -p native/dist
          for d in .artifacts/natives-*; do
            plat="${d##*natives-}"
            mkdir -p "native/dist/$plat"
            cp -v "$d"/* "native/dist/$plat/"
          done
          echo "--- final layout ---"
          find native/dist -type f | sort

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            REF="${GITHUB_REF_NAME}"
            VERSION="${REF#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "ERROR: could not resolve version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Publish to Central Portal
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: |
          ARGS=(publishAllToCentralPortal -Pjpdfium.version=${{ steps.v.outputs.version }})
          if [ "${{ inputs.autoRelease }}" = "true" ]; then
            ARGS+=(-PautoRelease=true)
          fi
          ./gradlew "${ARGS[@]}" --no-daemon --stacktrace

      - name: Attach CLI binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist/cli
          # Download-artifact nests each artifact under .artifacts/cli-<platform>/.
          for d in .artifacts/cli-*; do
            [ -d "$d" ] || continue
            cp -v "$d"/jpdfium-* dist/cli/ 2>/dev/null || true
          done
          if ls dist/cli/* >/dev/null 2>&1; then
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" --title "JPDFium ${TAG#v}" --generate-notes
            gh release upload "$TAG" dist/cli/* --clobber
            echo "Attached CLI binaries to release $TAG:" >> $GITHUB_STEP_SUMMARY
            ls -la dist/cli/ >> $GITHUB_STEP_SUMMARY
          else
            echo "No CLI binaries built for this release." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Summary
        run: |
          echo "### Published com.stirling:*:${{ steps.v.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.autoRelease }}" = "true" ]; then
            echo "Auto-release enabled - artifacts will land on Maven Central in 10–30 min." >> $GITHUB_STEP_SUMMARY
          else
            echo "Review and click **Publish** at https://central.sonatype.com/publishing/deployments" >> $GITHUB_STEP_SUMMARY
          fi


  # ── Post-Release Verification: Pull from Central and execute full smoke ──
  validate-maven-central:
    name: Verify Maven Central (${{ matrix.platform }})
    needs: publish
    if: inputs.autoRelease == true || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    runner: ubuntu-latest    }
          - { platform: linux-arm64,  runner: ubuntu-24.04-arm }
          - { platform: darwin-x64,   runner: macos-14         }
          - { platform: darwin-arm64, runner: macos-14         }
          - { platform: windows-x64,  runner: windows-latest   }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/setup-java@273229181560643261a71a1544c22304f2a40df8 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            REF="${GITHUB_REF_NAME}"
            VERSION="${REF#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for Maven Central availability & execute standalone validation
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -e
          echo "Verifying JPDFium $VERSION ($PLATFORM) from Maven Central..."

          # Poll Maven Central with backoff up to 25 minutes
          CENTRAL_URL="https://repo1.maven.org/maven2/com/stirling/jpdfium-natives-vips-${PLATFORM}/${VERSION}/jpdfium-natives-vips-${PLATFORM}-${VERSION}.jar"
          echo "Polling $CENTRAL_URL..."

          MAX_ATTEMPTS=50
          ATTEMPT=0
          FOUND=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$CENTRAL_URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Found published artifact on Maven Central (attempt $ATTEMPT)!"
              FOUND=1
              break
            fi
            echo "Attempt $ATTEMPT: artifact not yet visible (HTTP $STATUS), waiting 30s..."
            sleep 30
          done

          if [ $FOUND -ne 1 ]; then
            echo "ERROR: Artifact $CENTRAL_URL did not become available on Maven Central within timeout."
            exit 1
          fi

          # Create a standalone Gradle validation project that pulls solely from Maven Central
          WORK_DIR=$(mktemp -d 2>/dev/null || mktemp -d -t 'jpdfium-verify')
          cd "$WORK_DIR"

          cat << 'BUILD' > settings.gradle.kts
          rootProject.name = "jpdfium-central-verifier"
BUILD

          cat << BUILD > build.gradle.kts
          plugins {
              `java-application`
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              implementation("com.stirling:jpdfium:${VERSION}")
              implementation("com.stirling:jpdfium-vips:${VERSION}")
              runtimeOnly("com.stirling:jpdfium-natives-${PLATFORM}:${VERSION}")
              runtimeOnly("com.stirling:jpdfium-natives-vips-${PLATFORM}:${VERSION}")
          }

          application {
              mainClass.set("VerifyCentral")
          }
BUILD

          mkdir -p src/main/java
          cat << 'JAVA' > src/main/java/VerifyCentral.java
          import java.io.*;
          import java.nio.file.*;
          import java.util.*;
          import stirling.software.jpdfium.*;
          import stirling.software.jpdfium.vips.*;

          public class VerifyCentral {
              public static void main(String[] args) throws Exception {
                  System.out.println("=== Verifying Central Published JPDFium + Libvips Natives ===");

                  // 1. Initialize natives
                  VipsNatives.configure();
                  NativeLoader.ensureLoaded();

                  // 2. Probe libvips availability and all format savers
                  VipsAvailability.State state = VipsAvailability.probe();
                  System.out.println("Libvips available: " + state.available());
                  System.out.println("Platform: " + state.platform());
                  System.out.println("Version: " + state.version());
                  System.out.println("Savers: PNG=" + state.pngsave() + ", JPEG=" + state.jpegsave() + ", WEBP=" + state.webpsave()
                          + ", TIFF=" + state.tiffsave() + ", HEIF=" + state.heifsave() + ", JXL=" + state.jxlsave());

                  if (!state.available()) {
                      throw new IllegalStateException("Libvips not available: " + VipsAvailability.installMessage(state));
                  }
                  if (!state.pngsave() || !state.jpegsave() || !state.webpsave() || !state.tiffsave()) {
                      throw new IllegalStateException("Essential savers missing from bundled libvips!");
                  }

                  // 3. Create a blank PDF via PdfDocument, render page to PNG, JPEG, WEBP, TIFF, HEIF, JXL
                  try (PdfDocument doc = PdfDocument.blank(612, 792)) {
                      System.out.println("Testing PDF page conversion to multiple image formats...");
                      for (VipsFormat format : VipsFormat.values()) {
                          byte[] img = VipsImageConverter.pageToBytes(doc, 0, 150, format);
                          if (img == null || img.length < 32) {
                              throw new IllegalStateException("Failed to encode page to " + format);
                          }
                          System.out.println("  [PASS] " + format + " (bytes: " + img.length + ")");
                      }
                  }

                  System.out.println("=== Maven Central JPDFium verification successful! ===");
              }
          }
JAVA

          # Run the standalone verification using gradle
          gradle run --no-daemon --jvm-args="--enable-native-access=ALL-UNNAMED"

