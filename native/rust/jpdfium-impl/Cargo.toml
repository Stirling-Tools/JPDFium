[package]
name = "jpdfium-impl"
version = "0.1.0"
edition = "2021"

[lib]
name = "jpdfium_rust"
crate-type = ["staticlib"]

[dependencies]
libc = "0.2.189"
lopdf = { version = "0.45.0", default-features = false, features = ["chrono"] }
oxipng = { version = "10.2", default-features = false, features = ["zopfli"] }
zopfli = "0.8.3"
flate2 = "1.1.10"
fast_image_resize = "6.1"
# SVG rasterizer (Apache-2.0 OR MIT stack: resvg/usvg/tiny-skia/fontdb).
# Replaces librsvg in the vips stack: no cairo/gdk-pixbuf/X11, no GPL.
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
usvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
# CMYK JPEG encoder for DeviceCMYK image conversion. `ColorType::Cmyk` writes
# an Adobe APP14 (transform=0) JPEG with the samples inverted, which is exactly
# the layout PDFium decodes back with /Decode [1 0 1 0 1 0 1 0].
# `simd` enables runtime-detected AVX2 DCT/color paths on x86_64. It is a
# no-op on other architectures and falls back to the scalar path.
jpeg-encoder = { version = "0.7", features = ["simd"] }
